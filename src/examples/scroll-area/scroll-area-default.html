<!-- Vertical scroll area with custom scrollbar -->
<style>
  .scroll-area {
    position: relative;
    overflow: hidden;
    height: 192px;
    width: 192px;
    border-radius: var(--radius-medium);
    border: 1px solid var(--border);
  }
  .scroll-viewport {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .scroll-viewport::-webkit-scrollbar { display: none; }
  .scroll-content { padding: 12px; }
  .scroll-title {
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--foreground);
    font-family: var(--font-lexend, sans-serif);
  }
  .scroll-item {
    border-bottom: 1px solid var(--border);
    padding: 6px 0;
    font-size: 14px;
    color: var(--secondary-foreground);
    font-family: var(--font-lexend, sans-serif);
  }
  .scroll-item:last-child { border-bottom: none; }
</style>

<div class="scroll-area">
  <div class="scroll-viewport">
    <div class="scroll-content">
      <h4 class="scroll-title">Tags</h4>
      <div class="scroll-item">v1.0.0</div>
      <div class="scroll-item">v1.1.0</div>
      <div class="scroll-item">v1.2.0</div>
      <div class="scroll-item">v1.3.0</div>
      <div class="scroll-item">v2.0.0</div>
      <div class="scroll-item">v2.1.0</div>
      <div class="scroll-item">v2.2.0</div>
      <div class="scroll-item">v3.0.0</div>
      <div class="scroll-item">v3.1.0</div>
      <div class="scroll-item">v3.2.0</div>
      <div class="scroll-item">v4.0.0</div>
      <div class="scroll-item">v4.1.0</div>
      <div class="scroll-item">v4.2.0</div>
      <div class="scroll-item">v5.0.0</div>
    </div>
  </div>
</div>
