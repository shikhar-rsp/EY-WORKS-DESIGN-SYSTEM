<!-- Progress — default (60%) -->
<div role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" aria-label="Progress"
  style="
    position: relative; width: 256px; overflow: hidden;
    border-radius: var(--radius-full);
    background: var(--muted); height: 8px;
  "
>
  <div style="
    height: 100%; width: 100%; border-radius: var(--radius-full);
    background: var(--primary);
    transform: translateX(-40%);
    transition: transform 300ms ease-in-out;
  "></div>
</div>
