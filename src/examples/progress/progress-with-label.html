<!-- Progress — with label (Upload progress 66%) -->
<div style="display: flex; flex-direction: column; gap: var(--space-150); width: 256px; font-family: var(--font-lexend, sans-serif);">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 14px; color: var(--foreground);">Upload progress</span>
    <span style="font-size: 14px; color: var(--muted-foreground);">66%</span>
  </div>
  <div role="progressbar" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress"
    style="position: relative; width: 100%; height: 8px; overflow: hidden; border-radius: var(--radius-full); background: var(--muted);">
    <div style="height: 100%; width: 100%; border-radius: var(--radius-full); background: var(--primary);
      transform: translateX(-34%); transition: transform 300ms ease-in-out;"></div>
  </div>
</div>
