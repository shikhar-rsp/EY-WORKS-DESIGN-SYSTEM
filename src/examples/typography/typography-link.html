<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typography Link</title>
    <style>
      :root {
        --primary: #f8785e;
        --primary-hover: #cf624c;
        --ring: #f8785e;
        --radius-xsmall: 2px;
        --font-lexend: "Lexend", sans-serif;
      }

      .typography-link {
        font-family: var(--font-lexend, "Lexend", sans-serif);
        font-size: 0.875rem;
        color: var(--primary, #f8785e);
        text-decoration: underline;
        text-underline-offset: 2px;
        transition: color 150ms ease;
        border-radius: var(--radius-xsmall, 2px);
        outline: none;
        display: block;
      }

      .typography-link:hover {
        color: var(--primary-hover, #cf624c);
      }

      .typography-link:focus-visible {
        outline: 2px solid var(--ring, #f8785e);
        outline-offset: 1px;
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <a href="#" class="typography-link">Visit the documentation →</a>
      <a href="#" class="typography-link">Learn more about design tokens</a>
      <a href="#" target="_blank" rel="noopener noreferrer" class="typography-link">Opens in a new tab ↗</a>
    </div>
  </body>
</html>
