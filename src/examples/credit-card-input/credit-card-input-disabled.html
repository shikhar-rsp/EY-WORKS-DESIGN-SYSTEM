<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Credit Card Input — Disabled</title>
  <style>
    body { margin: 0; padding: 24px; font-family: 'Lexend', sans-serif; }
    /* Same markup as credit-card-input-default.html. The disabled state dims
       the wrapper and disables every input + the CVV reveal button. */
    [data-disabled] { opacity: 0.6; pointer-events: none; }
    .input:disabled { background: #f5f3f3; color: #b0a8a8; border-color: #ddd; cursor: not-allowed; }
  </style>
</head>
<body>
  <fieldset disabled data-disabled style="border:0;padding:0;margin:0">
    <input class="input" placeholder="0000 0000 0000 0000" value="5555 5555 5555 4444" autocomplete="cc-number" disabled />
    <input class="input" placeholder="Jane Appleseed"      value="Jane Appleseed"      autocomplete="cc-name"   disabled />
    <input class="input" placeholder="MM/YY"               value="12/29"               autocomplete="cc-exp"    disabled />
    <input class="input" placeholder="•••" type="password" value="321"                 autocomplete="cc-csc"    disabled />
  </fieldset>
</body>
</html>
