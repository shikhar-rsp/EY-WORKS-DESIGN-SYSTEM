<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Credit Card Input — Controlled</title>
  <link rel="stylesheet" href="credit-card-input-default.html" />
  <style>
    /* Wire your card-input markup (see credit-card-input-default.html) and
       attach `input` listeners on each field. The pattern below shows how to
       persist the four values into a single object and surface derived state. */
    body { margin: 0; padding: 24px; font-family: 'Lexend', sans-serif; }
    .meta { font-family: 'Geist Mono', monospace; font-size: 12px; color: #7a7272; margin-top: 12px; }
    .meta strong { color: #2e2b2b; }
  </style>
</head>
<body>
  <form id="cc-form">
    <!-- Reuse markup from credit-card-input-default.html for the visual + inputs. -->
    <input id="cc-number" name="number" placeholder="0000 0000 0000 0000" autocomplete="cc-number" />
    <input id="cc-name"   name="name"   placeholder="Jane Appleseed"      autocomplete="cc-name" />
    <input id="cc-exp"    name="expiry" placeholder="MM/YY"               autocomplete="cc-exp" />
    <input id="cc-cvv"    name="cvv"    placeholder="•••" type="password" autocomplete="cc-csc" />
  </form>
  <p class="meta">Detected network: <strong id="network">unknown</strong> · Luhn: <strong id="luhn">—</strong></p>

  <script>
    const detect = (raw) => {
      const d = raw.replace(/\D/g, '');
      if (/^4/.test(d)) return 'visa';
      if (/^(5[1-5]|2[2-7])/.test(d)) return 'mastercard';
      if (/^3[47]/.test(d)) return 'amex';
      if (/^(6011|65|64[4-9])/.test(d)) return 'discover';
      return 'unknown';
    };
    const luhn = (raw) => {
      const d = raw.replace(/\D/g, '');
      if (d.length < 12) return false;
      let sum = 0, alt = false;
      for (let i = d.length - 1; i >= 0; i--) {
        let n = +d[i]; if (alt) { n *= 2; if (n > 9) n -= 9; }
        sum += n; alt = !alt;
      }
      return sum % 10 === 0;
    };
    document.getElementById('cc-number').addEventListener('input', (e) => {
      document.getElementById('network').textContent = detect(e.target.value);
      document.getElementById('luhn').textContent = luhn(e.target.value) ? 'valid' : '—';
    });
  </script>
</body>
</html>
