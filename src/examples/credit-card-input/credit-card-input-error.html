<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Credit Card Input — Error</title>
  <style>
    /* Same markup as credit-card-input-default.html. The error state adds a
       destructive border on every input and renders a `role="alert"` message. */
    body { margin: 0; padding: 24px; font-family: 'Lexend', sans-serif; }
    .input { border-color: #c83b3b !important; box-shadow: 0 0 0 2px color-mix(in srgb, #c83b3b 30%, transparent) !important; }
    .error { font-size: 12px; color: #c83b3b; margin-top: 8px; }
  </style>
</head>
<body>
  <form aria-describedby="cc-error" aria-invalid="true">
    <input class="input" placeholder="0000 0000 0000 0000" value="4242 4242 4242 4243" autocomplete="cc-number" />
    <input class="input" placeholder="Jane Appleseed"      value="Jane Appleseed"     autocomplete="cc-name" />
    <input class="input" placeholder="MM/YY"               value="01/20"              autocomplete="cc-exp" />
    <input class="input" placeholder="•••" type="password" value="123"                autocomplete="cc-csc" />
  </form>
  <p id="cc-error" role="alert" class="error">Card has expired. Please use a different card.</p>
</body>
</html>
