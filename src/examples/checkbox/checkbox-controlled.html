<div style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer;" onclick="toggleControlled()">
  <span
    id="controlled-box"
    role="checkbox"
    aria-checked="false"
    data-state="unchecked"
    style="
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: var(--radius-small);
      border: 1.5px solid var(--border);
      background: var(--background);
      transition: background 150ms, border-color 150ms;
    "
  >
    <svg id="controlled-check" width="10" height="10" viewBox="0 0 10 10" fill="none" style="display: none;">
      <path d="M2 5l2.5 2.5L8 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>
  <span style="font-family: var(--font-lexend, sans-serif); font-size: 14px; color: var(--foreground); user-select: none;">
    Controlled checkbox
  </span>
</div>

<script>
  let isChecked = false;
  const box = document.getElementById('controlled-box');
  const check = document.getElementById('controlled-check');

  function toggleControlled() {
    isChecked = !isChecked;
    box.setAttribute('aria-checked', isChecked);
    box.setAttribute('data-state', isChecked ? 'checked' : 'unchecked');
    box.style.background = isChecked ? 'var(--primary)' : 'var(--background)';
    box.style.borderColor = isChecked ? 'var(--primary)' : 'var(--border)';
    check.style.display = isChecked ? 'block' : 'none';
  }
</script>
