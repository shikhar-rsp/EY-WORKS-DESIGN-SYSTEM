<label
  onclick="
    var box = this.querySelector('.cb-box');
    var icon = this.querySelector('.cb-icon');
    var checked = box.dataset.checked === 'true';
    checked = !checked;
    box.dataset.checked = checked;
    if (checked) {
      box.style.background = 'var(--color-bg-brand-bold)';
      box.style.border = 'none';
      icon.style.display = 'flex';
    } else {
      box.style.background = 'var(--background)';
      box.style.border = '1px solid var(--color-border-input)';
      icon.style.display = 'none';
    }
  "
  style="
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  "
>
  <span
    class="cb-box"
    data-checked="false"
    style="
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: var(--radius-xsmall);
      background: var(--background);
      border: 1px solid var(--color-border-input);
      flex-shrink: 0;
      transition: background 0.15s, border 0.15s;
    "
  >
    <span
      class="cb-icon"
      style="
        display: none;
        align-items: center;
        justify-content: center;
        color: var(--color-icon-inverse);
      "
    >
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 5L4 7.5L8 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </span>
  <span style="display: inline-flex; flex-direction: column; align-items: flex-start;">
    <span
      style="
        font-family: 'Lexend', sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 20px;
        color: var(--color-text);
        white-space: nowrap;
      "
    >
      Subscribe to newsletter
    </span>
    <span
      style="
        font-family: 'Lexend', sans-serif;
        font-size: 12px;
        font-weight: 400;
        line-height: 16px;
        color: var(--color-text-subtlest);
        white-space: nowrap;
      "
    >
      Get weekly updates and product news
    </span>
  </span>
</label>
