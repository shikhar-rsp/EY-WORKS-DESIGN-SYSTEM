<div style="display: flex; flex-direction: column; gap: 8px;">
  <label for="email" style="
    display: inline-flex;
    align-items: center;
    gap: var(--space-050);
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
    color: var(--foreground);
    user-select: none;
  ">Email address</label>
  <input
    id="email"
    type="email"
    placeholder="you@example.com"
    style="
      height: 36px;
      border-radius: var(--radius-medium);
      border: 1px solid var(--border-input);
      background: var(--background);
      padding: 0 var(--space-200);
      font-size: 14px;
      color: var(--foreground);
      outline: none;
    "
    onfocus="this.style.outline='2px solid var(--ring)'; this.style.outlineOffset='-2px';"
    onblur="this.style.outline='none';"
  />
</div>
