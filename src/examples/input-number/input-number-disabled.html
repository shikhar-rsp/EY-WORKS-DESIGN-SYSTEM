<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Number — Disabled</title>
    <style>
      :root {
        --border: #ebe9e8;
        --background: #ffffff;
        --foreground: #2e2b2b;
        --muted-foreground: #7a7272;
        --muted: #f5f4f3;
        --radius-medium: 8px;
        --font-lexend: "Lexend", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-lexend);
        background: var(--background);
        color: var(--foreground);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        min-height: 100vh;
      }

      .input-number {
        display: inline-flex;
        align-items: center;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-medium);
        background: var(--background);
        font-family: var(--font-lexend);
        font-size: 14px;
        color: var(--foreground);
        opacity: 0.5;
        cursor: not-allowed;
      }

      .input-number__btn {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 0 8px;
        background: transparent;
        border: none;
        color: var(--muted-foreground);
        cursor: not-allowed;
        pointer-events: none;
      }

      .input-number__btn--decrement {
        border-right: 1px solid var(--border);
        border-radius: var(--radius-medium) 0 0 var(--radius-medium);
      }

      .input-number__btn--increment {
        border-left: 1px solid var(--border);
        border-radius: 0 var(--radius-medium) var(--radius-medium) 0;
      }

      .input-number__field {
        flex: 1;
        min-width: 0;
        height: 100%;
        padding: 0 8px;
        background: transparent;
        border: none;
        font-family: var(--font-lexend);
        font-size: 14px;
        color: var(--foreground);
        text-align: center;
        outline: none;
        cursor: not-allowed;
        pointer-events: none;
      }

      .input-number__icon {
        width: 14px;
        height: 14px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="input-number" aria-disabled="true">
      <button class="input-number__btn input-number__btn--decrement" aria-label="Decrease value" disabled>
        <svg class="input-number__icon" viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
      <input
        class="input-number__field"
        type="text"
        inputmode="numeric"
        value="5"
        disabled
        aria-label="Number value"
      />
      <button class="input-number__btn input-number__btn--increment" aria-label="Increase value" disabled>
        <svg class="input-number__icon" viewBox="0 0 16 16" fill="none">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </body>
</html>
