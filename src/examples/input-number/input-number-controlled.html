<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Number — Controlled</title>
    <style>
      :root {
        --border: #ebe9e8;
        --background: #ffffff;
        --foreground: #2e2b2b;
        --muted-foreground: #7a7272;
        --muted: #f5f4f3;
        --ring: #f8785e;
        --radius-medium: 8px;
        --font-lexend: "Lexend", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-lexend);
        background: var(--background);
        color: var(--foreground);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        min-height: 100vh;
      }

      .wrapper {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .input-number {
        display: inline-flex;
        align-items: center;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-medium);
        background: var(--background);
        font-family: var(--font-lexend);
        font-size: 14px;
        color: var(--foreground);
        transition: box-shadow 150ms;
      }

      .input-number:focus-within {
        box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
      }

      .input-number__btn {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 0 8px;
        background: transparent;
        border: none;
        color: var(--muted-foreground);
        cursor: pointer;
        transition: color 150ms, background 150ms;
      }

      .input-number__btn:hover {
        color: var(--foreground);
        background: var(--muted);
      }

      .input-number__btn:disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .input-number__btn--decrement {
        border-right: 1px solid var(--border);
        border-radius: var(--radius-medium) 0 0 var(--radius-medium);
      }

      .input-number__btn--increment {
        border-left: 1px solid var(--border);
        border-radius: 0 var(--radius-medium) var(--radius-medium) 0;
      }

      .input-number__field {
        flex: 1;
        min-width: 0;
        height: 100%;
        padding: 0 8px;
        background: transparent;
        border: none;
        font-family: var(--font-lexend);
        font-size: 14px;
        color: var(--foreground);
        text-align: center;
        outline: none;
      }

      .input-number__icon {
        width: 14px;
        height: 14px;
        display: block;
      }

      .current-value {
        font-size: 14px;
        color: var(--muted-foreground);
      }

      .current-value strong {
        color: var(--foreground);
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="input-number" id="input-number-root">
        <button
          class="input-number__btn input-number__btn--decrement"
          aria-label="Decrease value"
          onclick="changeValue(-1)"
        >
          <svg class="input-number__icon" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
        <input
          class="input-number__field"
          id="input-number-field"
          type="text"
          inputmode="numeric"
          value="10"
          aria-label="Number value"
        />
        <button
          class="input-number__btn input-number__btn--increment"
          aria-label="Increase value"
          onclick="changeValue(1)"
        >
          <svg class="input-number__icon" viewBox="0 0 16 16" fill="none">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <span class="current-value">
        Current value: <strong id="display-value">10</strong>
      </span>
    </div>

    <script>
      const field = document.getElementById("input-number-field");
      const display = document.getElementById("display-value");
      const min = 0;
      const max = 100;
      const step = 1;

      const clamp = (v) => Math.min(max, Math.max(min, v));

      const updateUI = (val) => {
        field.value = val;
        display.textContent = val;
        document.querySelector(".input-number__btn--decrement").disabled = val <= min;
        document.querySelector(".input-number__btn--increment").disabled = val >= max;
      };

      const changeValue = (delta) => {
        const current = parseInt(field.value, 10) || 0;
        updateUI(clamp(current + delta * step));
      };

      field.addEventListener("change", () => {
        const parsed = parseInt(field.value, 10);
        updateUI(isNaN(parsed) ? 10 : clamp(parsed));
      });

      updateUI(10);
    </script>
  </body>
</html>
