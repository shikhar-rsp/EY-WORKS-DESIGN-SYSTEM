<!-- Steps – Interactive (horizontal, controlled with Next/Back buttons) -->
<div style="width: 100%; max-width: 512px; padding: 24px; font-family: var(--font-lexend, 'Lexend', sans-serif);">

  <!-- Steps track -->
  <div id="steps-root" data-slot="steps" data-orientation="horizontal" style="display: flex; flex-direction: row; align-items: flex-start; gap: 0;"></div>

  <!-- Navigation buttons -->
  <div style="margin-top: 24px; display: flex; align-items: center; gap: 12px;">
    <button
      id="steps-back-btn"
      type="button"
      onclick="stepsGoBack()"
      style="
        padding: 6px 16px; border-radius: 8px;
        border: 1px solid var(--border, #ebe9e8);
        background: transparent; color: var(--foreground, #2e2b2b);
        font-family: var(--font-lexend, 'Lexend', sans-serif); font-size: 14px; font-weight: 500;
        cursor: pointer; transition: background 0.15s;
      "
      onmouseover="if(!this.disabled) this.style.background='var(--muted, #f5f4f3)'"
      onmouseout="this.style.background='transparent'"
    >Back</button>
    <button
      id="steps-next-btn"
      type="button"
      onclick="stepsGoNext()"
      style="
        padding: 6px 16px; border-radius: 8px;
        border: 1px solid transparent;
        background: var(--primary, #f8785e); color: var(--primary-foreground, #ffffff);
        font-family: var(--font-lexend, 'Lexend', sans-serif); font-size: 14px; font-weight: 500;
        cursor: pointer; transition: background 0.15s;
      "
      onmouseover="if(!this.disabled) this.style.background='var(--primary-hover, #cf624c)'"
      onmouseout="this.style.background='var(--primary, #f8785e)'"
    >Next</button>
    <span id="steps-label" style="font-size: 12px; color: var(--muted-foreground, #7a7272);">Step 1 of 3</span>
  </div>

</div>

<script>
  var stepsData = [
    { value: '1', title: 'Account', description: 'Create your account' },
    { value: '2', title: 'Billing', description: 'Add payment method' },
    { value: '3', title: 'Confirm', description: 'Review and confirm' },
  ];
  var currentStep = 0; // 0-based index

  function renderSteps() {
    var root = document.getElementById('steps-root');
    root.innerHTML = '';

    stepsData.forEach(function(step, index) {
      var status = index < currentStep ? 'complete' : (index === currentStep ? 'current' : 'upcoming');

      var indicatorBg = status === 'complete' ? 'var(--primary, #f8785e)'
                      : status === 'current'   ? 'var(--background, #ffffff)'
                      :                          'var(--background, #ffffff)';
      var indicatorBorder = status === 'upcoming' ? 'var(--border, #ebe9e8)' : 'var(--primary, #f8785e)';
      var indicatorColor = status === 'complete' ? 'var(--primary-foreground, #ffffff)'
                         : status === 'current'  ? 'var(--primary, #f8785e)'
                         :                         'var(--muted-foreground, #7a7272)';
      var titleColor = status === 'upcoming' ? 'var(--muted-foreground, #7a7272)' : 'var(--foreground, #2e2b2b)';

      var innerContent = status === 'complete'
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : '<span>' + (index + 1) + '</span>';

      var item = document.createElement('div');
      item.setAttribute('data-slot', 'steps-item');
      item.setAttribute('data-state', status);
      item.style.cssText = 'display: flex; flex: 1; flex-direction: row; align-items: flex-start;';

      item.innerHTML =
        '<button type="button" data-slot="steps-indicator" data-state="' + status + '" ' +
          (status === 'current' ? 'aria-current="step" ' : '') +
          'onclick="stepsGoTo(' + index + ')" ' +
          'style="display:flex; flex-shrink:0; align-items:center; justify-content:center; width:32px; height:32px; border-radius:9999px; border:2px solid ' + indicatorBorder + '; background:' + indicatorBg + '; color:' + indicatorColor + '; font-family:var(--font-lexend,\'Lexend\',sans-serif); font-size:14px; font-weight:600; cursor:pointer; position:relative; z-index:10; transition:opacity 0.15s;">' +
          innerContent +
        '</button>' +
        '<div data-slot="steps-content" style="display:flex; flex-direction:column; align-items:center; padding-top:8px; padding-left:4px; padding-right:4px;">' +
          '<p style="font-family:var(--font-lexend,\'Lexend\',sans-serif); font-size:14px; font-weight:500; line-height:1; color:' + titleColor + '; margin:0;">' + step.title + '</p>' +
          '<p style="margin-top:4px; font-family:var(--font-lexend,\'Lexend\',sans-serif); font-size:12px; color:var(--muted-foreground,#7a7272); margin-bottom:0;">' + step.description + '</p>' +
        '</div>';

      root.appendChild(item);

      if (index < stepsData.length - 1) {
        var sep = document.createElement('div');
        sep.setAttribute('data-slot', 'steps-separator');
        sep.setAttribute('aria-hidden', 'true');
        sep.style.cssText = 'height:2px; flex:1; margin-top:16px; margin-left:4px; margin-right:4px; background:var(--border,#ebe9e8); transition:background 0.2s;';
        root.appendChild(sep);
      }
    });

    // Update buttons
    var backBtn = document.getElementById('steps-back-btn');
    var nextBtn = document.getElementById('steps-next-btn');
    var label = document.getElementById('steps-label');

    backBtn.disabled = currentStep === 0;
    backBtn.style.opacity = currentStep === 0 ? '0.4' : '1';
    backBtn.style.cursor = currentStep === 0 ? 'not-allowed' : 'pointer';

    nextBtn.disabled = currentStep === stepsData.length - 1;
    nextBtn.style.opacity = currentStep === stepsData.length - 1 ? '0.4' : '1';
    nextBtn.style.cursor = currentStep === stepsData.length - 1 ? 'not-allowed' : 'pointer';
    nextBtn.textContent = currentStep === stepsData.length - 1 ? 'Finish' : 'Next';

    label.textContent = 'Step ' + (currentStep + 1) + ' of ' + stepsData.length;
  }

  function stepsGoTo(index) {
    currentStep = index;
    renderSteps();
  }

  function stepsGoBack() {
    if (currentStep > 0) { currentStep--; renderSteps(); }
  }

  function stepsGoNext() {
    if (currentStep < stepsData.length - 1) { currentStep++; renderSteps(); }
  }

  // Initial render
  renderSteps();
</script>
