<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Empty — Minimal</title>
  <style>
    body { margin: 0; font-family: var(--font-lexend, 'Lexend', sans-serif); background: var(--background, #ffffff); }
    :root {
      --foreground: #2e2b2b; --muted-foreground: #7a7272;
      --space-300: 24px;
    }
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-300); padding: 40px var(--space-300); text-align: center; }
    .empty-title { font-size: 1rem; font-weight: 600; color: var(--foreground); margin: 0; }
    .empty-description { font-size: 0.875rem; line-height: 1.625; color: var(--muted-foreground); max-width: 20rem; margin: 0; }
  </style>
</head>
<body>
  <div class="empty">
    <h3 class="empty-title">Nothing here yet</h3>
    <p class="empty-description">Add items to see them listed here.</p>
  </div>
</body>
</html>
