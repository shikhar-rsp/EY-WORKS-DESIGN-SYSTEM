<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Empty — Default</title>
  <style>
    body { margin: 0; font-family: var(--font-lexend, 'Lexend', sans-serif); background: var(--background, #ffffff); color: var(--foreground, #2e2b2b); }
    :root {
      --background: #ffffff; --foreground: #2e2b2b;
      --muted: #fafafa; --muted-foreground: #7a7272;
      --border: #ebe9e8;
      --primary: #f8785e; --primary-foreground: #ffffff; --primary-hover: #cf624c;
      --secondary: #f4f4f4; --secondary-hover: #ebe9e8;
      --radius-medium: 8px; --radius-large: 16px; --radius-full: 99px;
      --space-200: 16px; --space-300: 24px;
    }
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-300); padding: var(--space-300); text-align: center; }
    .empty-header { display: flex; flex-direction: column; align-items: center; gap: var(--space-200); }
    .empty-media-icon { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: var(--radius-large); background: var(--muted); color: var(--muted-foreground); border: 1px solid var(--border); }
    .empty-title { font-size: 1rem; font-weight: 600; color: var(--foreground); margin: 0; }
    .empty-description { font-size: 0.875rem; line-height: 1.625; color: var(--muted-foreground); max-width: 20rem; margin: 0; }
    .empty-content { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--space-200); }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-medium); padding: 0 var(--space-200); height: 32px; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: background 0.15s; }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--secondary); color: var(--foreground); border-color: var(--border); }
    .btn-secondary:hover { background: var(--secondary-hover); }
  </style>
</head>
<body>
  <div class="empty" style="padding-top: 40px; padding-bottom: 40px;">
    <div class="empty-header">
      <div class="empty-media-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
        </svg>
      </div>
      <h3 class="empty-title">No messages yet</h3>
      <p class="empty-description">When you receive messages, they'll appear here.</p>
    </div>
    <div class="empty-content">
      <button class="btn btn-primary">Compose</button>
      <button class="btn btn-secondary">Invite teammates</button>
    </div>
  </div>
</body>
</html>
