<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: 'Lexend', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: var(--background, #ffffff); }
    .overlay { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(46,43,43,0.4); backdrop-filter: blur(2px); }
    .overlay.open { display: block; }
    .drawer { position: fixed; z-index: 50; bottom: 0; left: 0; right: 0; max-height: 85vh; border-radius: 16px 16px 0 0; border-top: 1px solid var(--border, #ebe9e8); background: var(--background, #ffffff); padding: 24px; box-shadow: 0 10px 60px rgba(0,0,0,0.15); transform: translateY(100%); transition: transform 0.3s ease; }
    .drawer.open { transform: translateY(0); }
    .handle { display: flex; justify-content: center; margin-bottom: 16px; }
    .handle-bar { width: 48px; height: 6px; border-radius: 99px; background: var(--muted, #fafafa); }
    .drawer-title { font-size: 18px; font-weight: 600; color: var(--foreground, #2e2b2b); margin: 0 0 4px; }
    .drawer-desc { font-size: 14px; color: var(--muted-foreground, #7a7272); margin: 0 0 16px; }
    .drawer-body { font-size: 14px; color: var(--secondary-foreground, #505258); margin: 16px 0; }
    .steps-placeholder { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 8px; background: var(--muted, #fafafa); color: var(--muted-foreground, #7a7272); font-size: 14px; margin-top: 16px; }
    .footer { display: flex; flex-direction: column; gap: 8px; padding-top: 16px; }
    .btn-primary { height: 36px; width: 100%; border-radius: 8px; border: none; background: var(--primary, #f8785e); color: var(--primary-foreground, #ffffff); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .btn-primary:hover { background: var(--primary-hover, #cf624c); }
    .btn-secondary { height: 36px; width: 100%; border-radius: 8px; border: 1px solid var(--border, #ebe9e8); background: var(--background, #ffffff); color: var(--foreground, #2e2b2b); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .btn-secondary:hover { background: var(--muted-hover, #fee4df); }
    .trigger { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border, #ebe9e8); background: var(--background, #ffffff); color: var(--foreground, #2e2b2b); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .trigger:hover { background: var(--muted-hover, #fee4df); border-color: var(--primary, #f8785e); }
  </style>
</head>
<body>
  <button class="trigger" onclick="openDrawer()">Open Drawer</button>
  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-describedby="drawer-desc">
    <div class="handle"><div class="handle-bar"></div></div>
    <h2 class="drawer-title" id="drawer-title">Move Goal</h2>
    <p class="drawer-desc" id="drawer-desc">Set your daily activity goal.</p>
    <div class="drawer-body">
      Drag the slider to set your daily step goal. The recommended amount is 10,000 steps per day.
      <div class="steps-placeholder">10,000 steps</div>
    </div>
    <div class="footer">
      <button class="btn-primary" onclick="closeDrawer()">Submit</button>
      <button class="btn-secondary" onclick="closeDrawer()">Cancel</button>
    </div>
  </div>
  <script>
    function openDrawer() {
      document.getElementById('overlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  </script>
</body>
</html>
