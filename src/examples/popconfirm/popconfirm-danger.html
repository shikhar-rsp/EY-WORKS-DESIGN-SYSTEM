<!-- Popconfirm — Danger variant (HTML + CSS custom properties) -->
<!-- Interactive note: this shows the static visual. JS toggle omitted for brevity. -->
<div style="position: relative; display: inline-block;">

  <!-- Trigger -->
  <button
    type="button"
    style="
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border-radius: var(--radius-medium);
      border: none;
      background: var(--destructive);
      color: var(--destructive-foreground);
      font-family: var(--font-lexend, 'Lexend', sans-serif);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    "
  >
    Delete
  </button>

  <!-- Popconfirm popup (shown on click) -->
  <div
    role="alertdialog"
    style="
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: 288px;
      border-radius: var(--radius-large);
      border: 1px solid var(--border);
      background: var(--background);
      padding: var(--space-200);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 50;
    "
  >
    <!-- Arrow -->
    <span style="
      position: absolute;
      bottom: -5px;
      left: 50%;
      margin-left: -4px;
      width: 8px;
      height: 8px;
      background: var(--background);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transform: rotate(45deg);
    "></span>

    <!-- Header: icon + title -->
    <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: var(--space-100);">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="margin-top: 2px; flex-shrink: 0; color: var(--warning-bold);" aria-hidden="true">
        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 5v3.5M8 10v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span style="font-family: var(--font-lexend, 'Lexend', sans-serif); font-size: 14px; font-weight: 600; color: var(--foreground);">
        Delete the task
      </span>
    </div>

    <!-- Description -->
    <p style="font-family: var(--font-lexend, 'Lexend', sans-serif); font-size: 12px; color: var(--muted-foreground); margin: 0 0 var(--space-150) 0;">
      Are you sure to delete this task?
    </p>

    <!-- Footer buttons -->
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button type="button" style="
        display: inline-flex; align-items: center; justify-content: center;
        height: 28px; padding: 0 12px;
        border-radius: var(--radius-medium); border: 1px solid var(--border);
        background: var(--background); color: var(--foreground);
        font-family: var(--font-lexend, 'Lexend', sans-serif); font-size: 12px; font-weight: 500;
        cursor: pointer;
      ">No</button>
      <button type="button" style="
        display: inline-flex; align-items: center; justify-content: center;
        height: 28px; padding: 0 12px;
        border-radius: var(--radius-medium); border: none;
        background: var(--destructive); color: var(--destructive-foreground);
        font-family: var(--font-lexend, 'Lexend', sans-serif); font-size: 12px; font-weight: 500;
        cursor: pointer;
      ">Yes</button>
    </div>
  </div>
</div>
