<!-- Popconfirm — Bottom-start placement (HTML + CSS custom properties) -->
<div style="position: relative; display: inline-block;">

  <!-- Trigger -->
  <button
    type="button"
    style="
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border-radius: var(--radius-medium);
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-lexend, 'Lexend', sans-serif);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    "
  >
    Bottom-start placement
  </button>

  <!-- Popup (bottom + start aligned) -->
  <div
    role="alertdialog"
    style="
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 288px;
      border-radius: var(--radius-large);
      border: 1px solid var(--border);
      background: var(--background);
      padding: var(--space-200);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 50;
    "
  >
    <!-- Arrow (top-start) -->
    <span style="
      position: absolute;
      top: -5px;
      left: 16px;
      width: 8px;
      height: 8px;
      background: var(--background);
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
      transform: rotate(45deg);
    "></span>

    <!-- Header -->
    <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: var(--space-100);">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="margin-top: 2px; flex-shrink: 0; color: var(--warning-bold);" aria-hidden="true">
        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 5v3.5M8 10v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span style="font-family: var(--font-lexend, 'Lexend', sans-serif); font-size: 14px; font-weight: 600; color: var(--foreground);">
        Confirm action
      </span>
    </div>

    <!-- Footer -->
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button type="button" style="
        display: inline-flex; align-items: center; height: 28px; padding: 0 12px;
        border-radius: var(--radius-medium); border: 1px solid var(--border);
        background: var(--background); color: var(--foreground);
        font-family: var(--font-lexend); font-size: 12px; font-weight: 500; cursor: pointer;
      ">Cancel</button>
      <button type="button" style="
        display: inline-flex; align-items: center; height: 28px; padding: 0 12px;
        border-radius: var(--radius-medium); border: none;
        background: var(--primary); color: var(--primary-foreground);
        font-family: var(--font-lexend); font-size: 12px; font-weight: 500; cursor: pointer;
      ">OK</button>
    </div>
  </div>
</div>
