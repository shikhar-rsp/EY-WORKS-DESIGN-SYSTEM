<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Popconfirm Default</title>
  <style>
    body {
      font-family: var(--font-lexend, 'Lexend', sans-serif);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--background, #ffffff);
    }
    .wrapper { position: relative; display: inline-flex; }
    .trigger {
      display: inline-flex; align-items: center; justify-content: center;
      height: 36px; padding: 0 16px;
      border-radius: var(--radius-medium, 8px);
      border: 1px solid var(--border, #ebe9e8);
      background: var(--background, #ffffff);
      color: var(--foreground, #2e2b2b);
      font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
      transition: background 0.15s;
    }
    .trigger:hover { background: var(--muted, #fdf4f2); }
    .popconfirm {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: 288px;
      border-radius: var(--radius-large, 16px);
      border: 1px solid var(--border, #ebe9e8);
      background: var(--background, #ffffff);
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      z-index: 50;
    }
    .popconfirm.open { display: block; }
    .popconfirm-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .popconfirm-icon { color: var(--warning-bold, #fbbf24); flex-shrink: 0; margin-top: 2px; }
    .popconfirm-title {
      font-size: 14px; font-weight: 600;
      color: var(--foreground, #2e2b2b);
      line-height: 1.4; margin: 0;
    }
    .popconfirm-desc {
      font-size: 12px;
      color: var(--muted-foreground, #7a7272);
      line-height: 1.6; margin: 0 0 12px;
    }
    .popconfirm-footer { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-cancel {
      display: inline-flex; align-items: center; justify-content: center;
      height: 28px; padding: 0 12px;
      border-radius: var(--radius-medium, 8px);
      border: 1px solid var(--border, #ebe9e8);
      background: var(--background, #ffffff);
      color: var(--foreground, #2e2b2b);
      font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: var(--muted, #fdf4f2); }
    .btn-action {
      display: inline-flex; align-items: center; justify-content: center;
      height: 28px; padding: 0 12px;
      border-radius: var(--radius-medium, 8px);
      border: none;
      background: var(--primary, #f8785e);
      color: var(--primary-foreground, #ffffff);
      font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-action:hover { background: var(--primary-hover, #cf624c); }
  </style>
</head>
<body>
  <div class="wrapper">
    <button class="trigger" id="trigger" onclick="togglePopconfirm()">Delete item</button>
    <div class="popconfirm" id="popconfirm" role="alertdialog" aria-modal="false" aria-labelledby="pc-title" aria-describedby="pc-desc">
      <div class="popconfirm-header">
        <span class="popconfirm-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </span>
        <h4 class="popconfirm-title" id="pc-title">Delete this item?</h4>
      </div>
      <p class="popconfirm-desc" id="pc-desc">This action cannot be undone.</p>
      <div class="popconfirm-footer">
        <button class="btn-cancel" onclick="closePopconfirm()">Cancel</button>
        <button class="btn-action" onclick="closePopconfirm()">Delete</button>
      </div>
    </div>
  </div>
  <script>
    function togglePopconfirm() {
      document.getElementById('popconfirm').classList.toggle('open');
    }
    function closePopconfirm() {
      document.getElementById('popconfirm').classList.remove('open');
    }
    document.addEventListener('click', (e) => {
      const trigger = document.getElementById('trigger');
      const pc = document.getElementById('popconfirm');
      if (!trigger.contains(e.target) && !pc.contains(e.target)) closePopconfirm();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopconfirm(); });
  </script>
</body>
</html>
