<style>
  .tag {
    display: inline-flex;
    align-items: center;
    border-radius: var(--radius-full, 99px);
    height: 28px;
    padding: var(--space-050, 4px) var(--space-150, 12px);
    gap: var(--space-050, 4px);
    cursor: pointer;
    user-select: none;
    transition: background-color 150ms;
    font-family: 'Lexend', sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 20px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .tag-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 12px;
    height: 12px;
    flex-shrink: 0;
  }
  .tag-brand { background: var(--primary, #f8785e); color: var(--primary-foreground, #ffffff); }
  .tag-brand:hover { background: var(--primary-hover, #cf624c); }

  .tag-outline-default {
    border: 1px solid var(--border, #ebe9e8);
    color: var(--foreground, #2e2b2b);
    background: transparent;
  }
  .tag-outline-default:hover { background: var(--secondary, #f4f4f4); }

  .tag-subtle-red { background: var(--destructive-subtle, #ffe5e5); color: var(--foreground, #2e2b2b); }
  .tag-subtle-red:hover { background: var(--destructive-hover, #ffcccc); }
</style>

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:24px;">
  <!-- Solid Brand with left icon -->
  <span class="tag tag-brand" tabindex="0">
    <span class="tag-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12H20M4 12L10 6M4 12L10 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    With Left Icon
  </span>

  <!-- Solid Brand with right icon (dismiss) -->
  <span class="tag tag-brand" tabindex="0">
    Dismissible
    <span class="tag-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </span>

  <!-- Solid Brand with both icons -->
  <span class="tag tag-brand" tabindex="0">
    <span class="tag-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12H20M4 12L10 6M4 12L10 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    Both Icons
    <span class="tag-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </span>

  <!-- Outline Default with left icon -->
  <span class="tag tag-outline-default" tabindex="0">
    <span class="tag-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12H20M4 12L10 6M4 12L10 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    With Left Icon
  </span>

  <!-- Outline Default with right icon -->
  <span class="tag tag-outline-default" tabindex="0">
    Dismissible
    <span class="tag-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </span>

  <!-- Subtle Red with right icon -->
  <span class="tag tag-subtle-red" tabindex="0">
    Remove
    <span class="tag-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </span>
</div>
