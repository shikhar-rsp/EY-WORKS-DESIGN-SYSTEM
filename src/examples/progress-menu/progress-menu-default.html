<div
  style="
    width: 320px;
    background: var(--background);
    border-radius: var(--radius-large);
    padding: 16px;
    font-family: var(--font-lexend), sans-serif;
  "
>
  <!-- Title -->
  <p style="font-size: 14px; font-weight: 600; color: var(--foreground); margin: 0 0 12px 0;">Getting Started</p>

  <!-- Step 1: Account Setup (success) -->
  <div
    style="
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px;
      border-radius: var(--radius-medium);
      background: var(--success-subtle);
    "
  >
    <div
      style="
        width: 28px; height: 28px;
        border-radius: 50%;
        background: var(--success-foreground);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      "
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="color: #ffffff;">
        <path d="M5 13L9 17L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div style="flex: 1; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <p style="font-size: 14px; font-weight: 500; color: var(--foreground); margin: 0;">Account Setup</p>
      </div>
      <p style="font-size: 12px; color: var(--muted-foreground); margin: 2px 0 0 0;">Complete your account</p>
    </div>
  </div>

  <!-- Connector 1 -->
  <div style="width: 2px; height: 20px; background: var(--accent-gray-subtler); margin-left: 19px;"></div>

  <!-- Step 2: Child Profile (in-progress) -->
  <div
    style="
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px;
      border-radius: var(--radius-medium);
      background: var(--primary-subtle);
    "
  >
    <div style="position: relative; width: 28px; height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
      <div
        style="
          position: absolute;
          width: 28px; height: 28px;
          border-radius: 50%;
          border: 2px solid var(--primary);
          opacity: 0.5;
        "
      ></div>
      <div
        style="
          width: 20px; height: 20px;
          border-radius: 50%;
          background: var(--primary-subtle);
          border: 2px solid var(--primary);
          display: flex; align-items: center; justify-content: center;
        "
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="color: var(--primary);">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 20C4 17.7909 7.58172 16 12 16C16.4183 16 20 17.7909 20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div style="flex: 1; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <p style="font-size: 14px; font-weight: 500; color: var(--foreground); margin: 0;">Child Profile</p>
        <span
          style="
            font-size: 11px;
            font-weight: 500;
            color: var(--muted-foreground);
            background: var(--muted);
            border-radius: var(--radius-small);
            padding: 1px 6px;
          "
        >Optional</span>
      </div>
      <p style="font-size: 12px; color: var(--muted-foreground); margin: 2px 0 0 0;">Add your child's info</p>
    </div>
  </div>

  <!-- Connector 2 -->
  <div style="width: 2px; height: 20px; background: var(--accent-gray-subtler); margin-left: 19px;"></div>

  <!-- Step 3: Global Settings (default) -->
  <div
    style="
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px;
      border-radius: var(--radius-medium);
      background: var(--accent-gray-subtlest);
    "
  >
    <div
      style="
        width: 28px; height: 28px;
        border-radius: 50%;
        background: var(--accent-gray-subtler);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      "
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="color: var(--subtle);">
        <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </div>
    <div style="flex: 1; min-width: 0;">
      <p style="font-size: 14px; font-weight: 500; color: var(--subtle); margin: 0;">Global Settings</p>
      <p style="font-size: 12px; color: var(--muted-foreground); margin: 2px 0 0 0;">Configure preferences</p>
    </div>
  </div>

  <!-- Buttons -->
  <div style="display: flex; gap: 8px; margin-top: 16px;">
    <button
      style="
        flex: 1;
        padding: 6px 16px;
        border-radius: var(--radius-medium);
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--primary);
        font-family: var(--font-lexend), sans-serif;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      "
      onmouseover="this.style.background='var(--muted-hover)'"
      onmouseout="this.style.background='var(--background)'"
    >
      Skip
    </button>
    <button
      style="
        flex: 1;
        padding: 6px 16px;
        border-radius: var(--radius-medium);
        border: 1px solid transparent;
        background: var(--primary);
        color: var(--primary-foreground);
        font-family: var(--font-lexend), sans-serif;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      "
      onmouseover="this.style.background='var(--primary-hover)'"
      onmouseout="this.style.background='var(--primary)'"
    >
      Continue
    </button>
  </div>
</div>
