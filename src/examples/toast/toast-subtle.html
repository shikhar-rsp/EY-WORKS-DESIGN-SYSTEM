<div style="
  display: flex;
  align-items: center;
  gap: var(--space-200);
  padding: var(--space-100);
  border-radius: var(--radius-medium);
  background: var(--background);
  box-shadow: 0px 0px 1px rgba(30,31,33,0.31), 0px 1px 1px rgba(30,31,33,0.25);
  width: 480px;
  max-width: 100%;
">
  <span style="color: var(--warning); flex-shrink: 0;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2a1 1 0 0 1 .894.553l9 18A1 1 0 0 1 21 22H3a1 1 0 0 1-.894-1.447l9-18A1 1 0 0 1 12 2zm0 7a1 1 0 0 1 1 1v4a1 1 0 1 1-2 0v-4a1 1 0 0 1 1-1zm1 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
    </svg>
  </span>
  <p style="flex: 1; font-family: var(--font-lexend), sans-serif; font-weight: 500; font-size: 14px; color: var(--foreground);">
    Your session will expire in 5 minutes.
  </p>
  <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
    <button type="button" style="
      background: none; border: none; cursor: pointer;
      color: var(--primary); font-family: var(--font-lexend), sans-serif;
      font-size: 14px; padding: 8px 16px; border-radius: var(--radius-medium);
    ">Extend</button>
    <button type="button" aria-label="Dismiss" style="
      background: none; border: none; cursor: pointer;
      color: var(--subtlest); padding: 8px 4px; border-radius: var(--radius-medium);
    ">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
