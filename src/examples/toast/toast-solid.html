<div style="
  display: flex;
  align-items: center;
  gap: var(--space-200);
  padding: var(--space-100);
  border-radius: var(--radius-medium);
  background: #ecfccb;
  box-shadow: 0px 0px 1px rgba(30,31,33,0.31), 0px 1px 1px rgba(30,31,33,0.25);
  width: 480px;
  max-width: 100%;
">
  <!-- Icon -->
  <span style="color: var(--success); flex-shrink: 0;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.707 8.707a1 1 0 0 0-1.414-1.414L10 14.586l-2.293-2.293a1 1 0 0 0-1.414 1.414l3 3a1 1 0 0 0 1.414 0l6-6z"/>
    </svg>
  </span>
  <!-- Message -->
  <p style="flex: 1; font-family: var(--font-lexend), sans-serif; font-weight: 500; font-size: 14px; line-height: 1.4; color: var(--foreground); min-width: 0;">
    Profile updated successfully.
  </p>
  <!-- Action -->
  <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
    <button type="button" style="
      display: flex; align-items: center; justify-content: center;
      height: 32px; min-width: 40px;
      padding: var(--space-100) var(--space-200);
      border-radius: var(--radius-medium);
      border: none; background: none; cursor: pointer;
      font-family: var(--font-lexend), sans-serif; font-size: 14px; font-weight: 400;
      color: var(--primary);
    ">View</button>
    <button type="button" aria-label="Dismiss" style="
      display: flex; align-items: center; justify-content: center;
      padding: var(--space-100) var(--space-050);
      border-radius: var(--radius-medium);
      border: none; background: none; cursor: pointer;
      color: var(--subtlest);
    ">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>
