<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AspectRatio Default</title>
</head>
<body>
  <div style="width: 100%; max-width: 384px;">
    <div
      style="
        aspect-ratio: 16 / 9;
        width: 100%;
        overflow: hidden;
        position: relative;
        border-radius: var(--radius-medium);
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-lexend), sans-serif;
        font-size: 14px;
        color: var(--muted-foreground);
      "
    >
      16 / 9
    </div>
  </div>
</body>
</html>
