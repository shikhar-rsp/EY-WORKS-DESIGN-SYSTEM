<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AspectRatio Ratios</title>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 16px; width: 100%;">
    <div>
      <p style="margin: 0 0 4px; font-family: var(--font-lexend), sans-serif; font-size: 12px; color: var(--muted-foreground);">1 / 1</p>
      <div style="aspect-ratio: 1 / 1; width: 100%; border-radius: var(--radius-medium); background: var(--muted); display: flex; align-items: center; justify-content: center; font-family: var(--font-lexend), sans-serif; font-size: 14px; color: var(--muted-foreground);">1 / 1</div>
    </div>
    <div>
      <p style="margin: 0 0 4px; font-family: var(--font-lexend), sans-serif; font-size: 12px; color: var(--muted-foreground);">4 / 3</p>
      <div style="aspect-ratio: 4 / 3; width: 100%; border-radius: var(--radius-medium); background: var(--muted); display: flex; align-items: center; justify-content: center; font-family: var(--font-lexend), sans-serif; font-size: 14px; color: var(--muted-foreground);">4 / 3</div>
    </div>
    <div>
      <p style="margin: 0 0 4px; font-family: var(--font-lexend), sans-serif; font-size: 12px; color: var(--muted-foreground);">16 / 9</p>
      <div style="aspect-ratio: 16 / 9; width: 100%; border-radius: var(--radius-medium); background: var(--muted); display: flex; align-items: center; justify-content: center; font-family: var(--font-lexend), sans-serif; font-size: 14px; color: var(--muted-foreground);">16 / 9</div>
    </div>
    <div>
      <p style="margin: 0 0 4px; font-family: var(--font-lexend), sans-serif; font-size: 12px; color: var(--muted-foreground);">21 / 9</p>
      <div style="aspect-ratio: 21 / 9; width: 100%; border-radius: var(--radius-medium); background: var(--muted); display: flex; align-items: center; justify-content: center; font-family: var(--font-lexend), sans-serif; font-size: 14px; color: var(--muted-foreground);">21 / 9</div>
    </div>
  </div>
</body>
</html>
