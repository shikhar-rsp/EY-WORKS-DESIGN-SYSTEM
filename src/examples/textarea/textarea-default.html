<textarea
  placeholder="Type your message here…"
  style="
    display: flex;
    min-height: 80px;
    width: 100%;
    border-radius: var(--radius-medium);
    border: 1px solid var(--border-input);
    background: var(--background);
    padding: var(--space-150) var(--space-200);
    font-family: var(--font-lexend), sans-serif;
    font-size: 14px;
    color: var(--foreground);
    resize: vertical;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
    box-sizing: border-box;
  "
  onfocus="this.style.borderColor='var(--ring)'; this.style.boxShadow='0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent)';"
  onblur="this.style.borderColor='var(--border-input)'; this.style.boxShadow='0 1px 2px rgba(0,0,0,0.05)';"
></textarea>
