<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Button Sizes</title>
</head>
<body>
  <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <button style="display:inline-flex;height:32px;align-items:center;justify-content:center;padding:0 var(--space-200);border:1px solid transparent;border-radius:var(--radius-medium);background:var(--primary);color:var(--primary-foreground);font-family:var(--font-lexend),sans-serif;font-size:14px;font-weight:500;cursor:pointer;">Small</button>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">sm</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <button style="display:inline-flex;height:36px;align-items:center;justify-content:center;padding:0 var(--space-200);border:1px solid transparent;border-radius:var(--radius-medium);background:var(--primary);color:var(--primary-foreground);font-family:var(--font-lexend),sans-serif;font-size:14px;font-weight:500;cursor:pointer;">Default</button>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">default</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <button style="display:inline-flex;height:40px;align-items:center;justify-content:center;padding:0 var(--space-200);border:1px solid transparent;border-radius:var(--radius-medium);background:var(--primary);color:var(--primary-foreground);font-family:var(--font-lexend),sans-serif;font-size:14px;font-weight:500;cursor:pointer;">Large</button>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">lg</span>
    </div>
  </div>
</body>
</html>
