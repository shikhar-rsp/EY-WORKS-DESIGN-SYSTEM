<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Button Outline</title>
</head>
<body>
  <button
    style="
      display: inline-flex; height: 36px; align-items: center; justify-content: center;
      padding: 0 var(--space-200); border: 1px solid var(--border);
      border-radius: var(--radius-medium); background: var(--background);
      color: var(--foreground); font-family: var(--font-lexend), sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s;
    "
    onmouseover="this.style.background='var(--muted-hover)';this.style.borderColor='var(--primary)'"
    onmouseout="this.style.background='var(--background)';this.style.borderColor='var(--border)'"
  >
    Outline
  </button>
</body>
</html>
