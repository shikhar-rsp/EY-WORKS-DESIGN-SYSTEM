<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Button Ghost</title>
</head>
<body>
  <button
    style="
      display: inline-flex; height: 36px; align-items: center; justify-content: center;
      padding: 0 var(--space-200); border: 1px solid transparent;
      border-radius: var(--radius-medium); background: transparent;
      color: var(--primary); font-family: var(--font-lexend), sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
    "
    onmouseover="this.style.background='var(--muted-hover)'"
    onmouseout="this.style.background='transparent'"
  >
    Ghost
  </button>
</body>
</html>
