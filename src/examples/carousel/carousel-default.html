<div style="position: relative; width: 100%; max-width: 384px; padding: 0 32px; outline: none;">
  <div style="overflow: hidden;">
    <div
      id="carousel-default-track"
      style="display: flex; transition: transform 300ms ease-in-out; transform: translateX(0%);"
    >
      <div style="min-width: 0; flex-shrink: 0; flex-grow: 0; flex-basis: 100%; padding-left: 16px;">
        <div style="display: flex; aspect-ratio: 1; align-items: center; justify-content: center; border-radius: var(--radius-large); border: 1px solid var(--border); background: var(--muted); font-size: 36px; font-weight: 700; color: var(--foreground);">1</div>
      </div>
      <div style="min-width: 0; flex-shrink: 0; flex-grow: 0; flex-basis: 100%; padding-left: 16px;">
        <div style="display: flex; aspect-ratio: 1; align-items: center; justify-content: center; border-radius: var(--radius-large); border: 1px solid var(--border); background: var(--muted); font-size: 36px; font-weight: 700; color: var(--foreground);">2</div>
      </div>
      <div style="min-width: 0; flex-shrink: 0; flex-grow: 0; flex-basis: 100%; padding-left: 16px;">
        <div style="display: flex; aspect-ratio: 1; align-items: center; justify-content: center; border-radius: var(--radius-large); border: 1px solid var(--border); background: var(--muted); font-size: 36px; font-weight: 700; color: var(--foreground);">3</div>
      </div>
      <div style="min-width: 0; flex-shrink: 0; flex-grow: 0; flex-basis: 100%; padding-left: 16px;">
        <div style="display: flex; aspect-ratio: 1; align-items: center; justify-content: center; border-radius: var(--radius-large); border: 1px solid var(--border); background: var(--muted); font-size: 36px; font-weight: 700; color: var(--foreground);">4</div>
      </div>
      <div style="min-width: 0; flex-shrink: 0; flex-grow: 0; flex-basis: 100%; padding-left: 16px;">
        <div style="display: flex; aspect-ratio: 1; align-items: center; justify-content: center; border-radius: var(--radius-large); border: 1px solid var(--border); background: var(--muted); font-size: 36px; font-weight: 700; color: var(--foreground);">5</div>
      </div>
    </div>
  </div>

  <button
    id="default-prev"
    aria-label="Previous slide"
    onclick="defaultPrev()"
    disabled
    style="
      position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
      display: flex; width: 32px; height: 32px; align-items: center; justify-content: center;
      border-radius: 50%; border: 1px solid var(--border); background: var(--background);
      color: var(--foreground); opacity: 0.5; cursor: not-allowed;
    "
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
  </button>

  <button
    id="default-next"
    aria-label="Next slide"
    onclick="defaultNext()"
    style="
      position: absolute; right: -16px; top: 50%; transform: translateY(-50%);
      display: flex; width: 32px; height: 32px; align-items: center; justify-content: center;
      border-radius: 50%; border: 1px solid var(--border); background: var(--background);
      color: var(--foreground); cursor: pointer;
    "
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
  </button>
</div>

<script>
  let defaultIndex = 0;
  const defaultTotal = 5;
  const defaultTrack = document.getElementById('carousel-default-track');
  const defaultPrevBtn = document.getElementById('default-prev');
  const defaultNextBtn = document.getElementById('default-next');

  function updateDefault() {
    defaultTrack.style.transform = `translateX(-${defaultIndex * 100}%)`;
    defaultPrevBtn.disabled = defaultIndex === 0;
    defaultPrevBtn.style.opacity = defaultIndex === 0 ? '0.5' : '1';
    defaultPrevBtn.style.cursor = defaultIndex === 0 ? 'not-allowed' : 'pointer';
    defaultNextBtn.disabled = defaultIndex >= defaultTotal - 1;
    defaultNextBtn.style.opacity = defaultIndex >= defaultTotal - 1 ? '0.5' : '1';
    defaultNextBtn.style.cursor = defaultIndex >= defaultTotal - 1 ? 'not-allowed' : 'pointer';
  }

  function defaultPrev() { if (defaultIndex > 0) { defaultIndex--; updateDefault(); } }
  function defaultNext() { if (defaultIndex < defaultTotal - 1) { defaultIndex++; updateDefault(); } }
</script>
