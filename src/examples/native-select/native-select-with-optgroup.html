<div style="position: relative; display: inline-flex; width: 224px; align-items: center;">
  <select style="
    height: 36px; width: 100%; appearance: none;
    border-radius: var(--radius-medium); border: 1px solid var(--border-input);
    background: var(--background); padding-left: var(--space-200); padding-right: 32px;
    font-size: 14px; color: var(--foreground); outline: none; cursor: pointer;
  ">
    <option value="">Choose a fruit…</option>
    <optgroup label="Citrus">
      <option value="orange">Orange</option>
      <option value="lemon">Lemon</option>
      <option value="grapefruit">Grapefruit</option>
    </optgroup>
    <optgroup label="Tropical">
      <option value="mango">Mango</option>
      <option value="papaya">Papaya</option>
    </optgroup>
  </select>
  <span aria-hidden="true" style="pointer-events: none; position: absolute; right: var(--space-200); display: inline-flex; align-items: center; color: var(--muted-foreground);">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </span>
</div>
