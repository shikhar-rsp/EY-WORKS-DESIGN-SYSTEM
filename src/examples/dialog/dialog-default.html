<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: 'Lexend', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: var(--background, #ffffff); }
    .trigger { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 16px; border-radius: 8px; border: none; background: var(--primary, #f8785e); color: var(--primary-foreground, #ffffff); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .trigger:hover { background: var(--primary-hover, #cf624c); }
    .overlay { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(46,43,43,0.4); backdrop-filter: blur(2px); }
    .overlay.open { display: block; }
    .dialog { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 51; width: 90%; max-width: 512px; border-radius: 16px; border: 1px solid var(--border, #ebe9e8); background: var(--background, #ffffff); padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .dialog.open { display: block; }
    .close-x { position: absolute; top: 16px; right: 16px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; border: none; background: transparent; color: var(--muted-foreground, #7a7272); cursor: pointer; }
    .close-x:hover { background: var(--muted-hover, #fee4df); color: var(--foreground, #2e2b2b); }
    .dialog-title { font-size: 18px; font-weight: 600; color: var(--foreground, #2e2b2b); margin: 0 0 6px; }
    .dialog-desc { font-size: 14px; color: var(--muted-foreground, #7a7272); margin: 0 0 16px; line-height: 1.6; }
    .dialog-body { font-size: 14px; color: var(--secondary-foreground, #505258); margin-bottom: 16px; }
    .footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .btn-cancel { height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border, #ebe9e8); background: var(--background, #ffffff); color: var(--foreground, #2e2b2b); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .btn-cancel:hover { background: var(--muted-hover, #fee4df); }
    .btn-primary { height: 36px; padding: 0 16px; border-radius: 8px; border: none; background: var(--primary, #f8785e); color: var(--primary-foreground, #ffffff); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .btn-primary:hover { background: var(--primary-hover, #cf624c); }
  </style>
</head>
<body>
  <button class="trigger" onclick="openDialog()">Open Dialog</button>
  <div class="overlay" id="overlay" onclick="closeDialog()"></div>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-desc">
    <button class="close-x" onclick="closeDialog()" aria-label="Close dialog">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
    <h2 class="dialog-title" id="dialog-title">Edit Profile</h2>
    <p class="dialog-desc" id="dialog-desc">Make changes to your profile here. Click save when you're done.</p>
    <div class="dialog-body">Your changes will be visible to other users immediately.</div>
    <div class="footer">
      <button class="btn-cancel" onclick="closeDialog()">Cancel</button>
      <button class="btn-primary" onclick="closeDialog()">Save Changes</button>
    </div>
  </div>
  <script>
    function openDialog() {
      document.getElementById('overlay').classList.add('open');
      document.getElementById('dialog').classList.add('open');
    }
    function closeDialog() {
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('dialog').classList.remove('open');
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDialog(); });
  </script>
</body>
</html>
