<!-- Sheet triggered by a button — static representation -->
<style>
  .sheet-trigger {
    display: inline-flex;
    height: 36px;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-medium);
    border: 1px solid var(--border);
    background: var(--background);
    padding: 0 var(--space-200);
    font-size: 14px;
    font-weight: 500;
    color: var(--foreground);
    cursor: pointer;
    font-family: var(--font-lexend, sans-serif);
    transition: background 150ms;
  }
  .sheet-trigger:hover { background: var(--muted-hover); }

  /* Overlay */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(46,43,43,0.4);
    backdrop-filter: blur(2px);
    display: none;
  }

  /* Panel */
  .sheet-panel {
    position: fixed;
    inset-block: 0;
    right: 0;
    z-index: 50;
    height: 100%;
    width: 75%;
    max-width: 384px;
    border-left: 1px solid var(--border);
    background: var(--background);
    box-shadow: -4px 0 24px rgba(0,0,0,0.08);
    padding: var(--space-300);
    display: none;
    flex-direction: column;
    font-family: var(--font-lexend, sans-serif);
  }

  .sheet-panel.open, .sheet-overlay.open { display: flex; }

  .sheet-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--foreground);
    margin-bottom: 4px;
  }
  .sheet-description {
    font-size: 14px;
    color: var(--muted-foreground);
    margin-bottom: var(--space-200);
  }
  .sheet-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--foreground);
    margin-bottom: 6px;
  }
  .sheet-input {
    height: 36px;
    border-radius: var(--radius-medium);
    border: 1px solid var(--border-input);
    background: var(--background);
    padding: 0 var(--space-150);
    font-size: 14px;
    color: var(--foreground);
    width: 100%;
    margin-bottom: var(--space-150);
    font-family: var(--font-lexend, sans-serif);
  }
  .sheet-footer {
    margin-top: auto;
    display: flex;
    justify-content: flex-end;
    gap: var(--space-150);
  }
  .btn-secondary {
    display: inline-flex; height: 36px; align-items: center; justify-content: center;
    border-radius: var(--radius-medium); border: 1px solid var(--border);
    background: var(--background); padding: 0 var(--space-200);
    font-size: 14px; font-weight: 500; color: var(--foreground); cursor: pointer;
    font-family: var(--font-lexend, sans-serif);
  }
  .btn-primary {
    display: inline-flex; height: 36px; align-items: center; justify-content: center;
    border-radius: var(--radius-medium); border: 1px solid transparent;
    background: var(--primary); padding: 0 var(--space-200);
    font-size: 14px; font-weight: 500; color: var(--primary-foreground); cursor: pointer;
    font-family: var(--font-lexend, sans-serif);
  }
</style>

<button class="sheet-trigger" onclick="document.getElementById('sheet').classList.add('open');document.getElementById('overlay').classList.add('open')">
  Open Sheet
</button>

<div class="sheet-overlay" id="overlay" onclick="document.getElementById('sheet').classList.remove('open');this.classList.remove('open')"></div>

<div class="sheet-panel" id="sheet">
  <div class="sheet-title">Edit Profile</div>
  <div class="sheet-description">Make changes to your profile here.</div>

  <label class="sheet-label">Name</label>
  <input class="sheet-input" type="text" value="Muhammad Hasan" />

  <label class="sheet-label">Username</label>
  <input class="sheet-input" type="text" value="@mhasan" />

  <div class="sheet-footer">
    <button class="btn-secondary" onclick="document.getElementById('sheet').classList.remove('open');document.getElementById('overlay').classList.remove('open')">Cancel</button>
    <button class="btn-primary" onclick="document.getElementById('sheet').classList.remove('open');document.getElementById('overlay').classList.remove('open')">Save Changes</button>
  </div>
</div>
