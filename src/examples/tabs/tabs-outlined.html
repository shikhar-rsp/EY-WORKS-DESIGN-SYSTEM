<style>
  .tabs-list-outlined {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px;
    border-radius: 9999px;
    background: var(--muted);
  }
  .tabs-trigger-outlined {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    font-size: 14px;
    font-family: var(--font-lexend, sans-serif);
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--muted-foreground);
    border-radius: 9999px;
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }
  .tabs-trigger-outlined:hover { background: var(--primary-subtle); color: var(--foreground); }
  .tabs-trigger-outlined[aria-selected="true"] {
    background: var(--primary-subtle-pressed);
    color: var(--foreground);
    font-weight: 600;
  }
  .tabs-content-outlined { display: none; margin-top: 16px; font-size: 14px; color: var(--secondary-foreground); font-family: var(--font-lexend, sans-serif); }
  .tabs-content-outlined.active { display: block; }
</style>

<div>
  <div class="tabs-list-outlined" role="tablist">
    <button class="tabs-trigger-outlined" role="tab" aria-selected="true" onclick="selectOutlined(event, 'all')">All</button>
    <button class="tabs-trigger-outlined" role="tab" aria-selected="false" onclick="selectOutlined(event, 'active')">Active</button>
    <button class="tabs-trigger-outlined" role="tab" aria-selected="false" onclick="selectOutlined(event, 'closed')">Closed</button>
  </div>
  <div id="all-o" class="tabs-content-outlined active">Showing all items.</div>
  <div id="active-o" class="tabs-content-outlined">Showing active items only.</div>
  <div id="closed-o" class="tabs-content-outlined">Showing closed items only.</div>
</div>
<script>
function selectOutlined(e, id) {
  document.querySelectorAll('.tabs-trigger-outlined').forEach(t => t.setAttribute('aria-selected', 'false'));
  document.querySelectorAll('.tabs-content-outlined').forEach(c => c.classList.remove('active'));
  e.target.setAttribute('aria-selected', 'true');
  document.getElementById(id + '-o').classList.add('active');
}
</script>
