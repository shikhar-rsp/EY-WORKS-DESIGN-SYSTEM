<style>
  .loz {
    display: inline-flex;
    align-items: center;
    border-radius: 4px;
    flex-shrink: 0;
    height: 16px;
    padding: 0 4px;
    gap: 4px;
    font-family: 'Lexend', sans-serif;
    font-weight: 400;
    font-size: 12px;
    line-height: 16px;
    white-space: nowrap;
    user-select: none;
  }
  .loz--solid-brand    { background-color: var(--primary, #f8785e); color: #ffffff; }
  .loz--outline-blue   { background: transparent; border: 1px solid var(--info, #2d70cf); color: var(--info, #2d70cf); }
  .loz--light-green    { background-color: var(--accent-green, #d1fae5); color: var(--accent-green-bold, #229666); }
  .loz--outfilled-red  { background-color: var(--background, #ffffff); border: 1px solid var(--destructive, #cc0000); color: var(--destructive, #cc0000); }
  .loz-icon { display: inline-flex; align-items: center; flex-shrink: 0; width: 14px; height: 14px; }
</style>

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px;">
  <!-- Solid / Brand -->
  <div class="loz loz--solid-brand">
    <span class="loz-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    In Progress
  </div>
  <!-- Outline / Blue -->
  <div class="loz loz--outline-blue">
    <span class="loz-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    Review
  </div>
  <!-- Light / Green -->
  <div class="loz loz--light-green">
    <span class="loz-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    Approved
  </div>
  <!-- Outline Filled / Red -->
  <div class="loz loz--outfilled-red">
    <span class="loz-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    Blocked
  </div>
