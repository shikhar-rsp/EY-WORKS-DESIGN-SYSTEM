<style>
  .loz {
    display: inline-flex;
    align-items: center;
    border-radius: 4px;
    flex-shrink: 0;
    height: 16px;
    padding: 0 4px;
    gap: 4px;
    font-family: 'Lexend', sans-serif;
    font-weight: 400;
    font-size: 12px;
    line-height: 16px;
    white-space: nowrap;
    user-select: none;
  }
  /* light backgrounds */
  .loz--default  { background: var(--muted, #fafafa); color: var(--foreground, #2e2b2b); }
  .loz--red      { background: var(--destructive-hover, #ffcccc); color: var(--destructive, #cc0000); }
  .loz--blue     { background: var(--accent-blue, #d7e8ff); color: var(--info, #2d70cf); }
  .loz--yellow   { background: var(--accent-yellow, #fef3c7); color: var(--warning, #d97706); }
  .loz--lime     { background: var(--accent-lime, #ecfccb); color: var(--success, #65a30d); }
  .loz--brand    { background: var(--primary-subtle, #fee4df); color: var(--primary, #f8785e); }
  .loz--teal     { background: var(--accent-teal, #d9f0f7); color: var(--accent-teal-bold, #358eac); }
  .loz--magenta  { background: var(--accent-magenta, #f8e0ee); color: var(--accent-magenta-bold, #b24f8c); }
  .loz--green    { background: var(--accent-green, #d1fae5); color: var(--accent-green-bold, #229666); }
  .loz--grey     { background: var(--secondary, #f4f4f4); color: var(--secondary-foreground, #505258); }
</style>

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px;">
  <div class="loz loz--default">Default</div>
  <div class="loz loz--red">Red</div>
  <div class="loz loz--blue">Blue</div>
  <div class="loz loz--yellow">Yellow</div>
  <div class="loz loz--lime">Lime</div>
  <div class="loz loz--brand">Brand</div>
  <div class="loz loz--teal">Teal</div>
  <div class="loz loz--magenta">Magenta</div>
  <div class="loz loz--green">Green</div>
  <div class="loz loz--grey">Grey</div>
</div>
