<style>
  .loz {
    display: inline-flex;
    align-items: center;
    border-radius: 4px;
    flex-shrink: 0;
    height: 16px;
    padding: 0 4px;
    gap: 4px;
    font-family: 'Lexend', sans-serif;
    font-weight: 400;
    font-size: 12px;
    line-height: 16px;
    white-space: nowrap;
    user-select: none;
    border-style: solid;
    border-width: 1px;
    background-color: var(--background, #ffffff);
  }
  .loz--default  { border-color: var(--border-hover, #c2bcbb); color: var(--foreground, #2e2b2b); }
  .loz--red      { border-color: var(--destructive, #cc0000); color: var(--destructive, #cc0000); }
  .loz--blue     { border-color: var(--info, #2d70cf); color: var(--info, #2d70cf); }
  .loz--yellow   { border-color: var(--warning, #d97706); color: var(--warning, #d97706); }
  .loz--lime     { border-color: var(--success, #65a30d); color: var(--success, #65a30d); }
  .loz--brand    { border-color: var(--primary, #f8785e); color: var(--primary, #f8785e); }
  .loz--teal     { border-color: var(--accent-teal-bold, #358eac); color: var(--accent-teal-bold, #358eac); }
  .loz--magenta  { border-color: var(--accent-magenta-bold, #b24f8c); color: var(--accent-magenta-bold, #b24f8c); }
  .loz--green    { border-color: var(--accent-green-bold, #229666); color: var(--accent-green-bold, #229666); }
  .loz--grey     { border-color: var(--border-hover, #c2bcbb); color: var(--secondary-foreground, #505258); }
</style>

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px;">
  <div class="loz loz--default">Default</div>
  <div class="loz loz--red">Red</div>
  <div class="loz loz--blue">Blue</div>
  <div class="loz loz--yellow">Yellow</div>
  <div class="loz loz--lime">Lime</div>
  <div class="loz loz--brand">Brand</div>
  <div class="loz loz--teal">Teal</div>
  <div class="loz loz--magenta">Magenta</div>
  <div class="loz loz--green">Green</div>
  <div class="loz loz--grey">Grey</div>
</div>
