<!-- Multi-month calendar — shows two months side by side -->
<!-- See React tab for the full interactive version -->
<div style="display: flex; gap: 16px; flex-wrap: wrap;">

  <!-- Month 1 -->
  <div style="display: inline-block; border-radius: var(--radius-medium); border: 1px solid var(--border); background: var(--background); padding: 12px; font-family: var(--font-lexend, sans-serif); font-size: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
      <button onclick="multiCalPrev()" style="width: 28px; height: 28px; border-radius: var(--radius-small); border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--foreground);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span id="multi-cap-1" style="font-weight: 600; color: var(--foreground);"></span>
      <div style="width: 28px;"></div>
    </div>
    <div id="multi-wd-1" style="display: grid; grid-template-columns: repeat(7, 32px); gap: 2px; margin-bottom: 4px;"></div>
    <div id="multi-grid-1" style="display: grid; grid-template-columns: repeat(7, 32px); gap: 2px;"></div>
  </div>

  <!-- Month 2 -->
  <div style="display: inline-block; border-radius: var(--radius-medium); border: 1px solid var(--border); background: var(--background); padding: 12px; font-family: var(--font-lexend, sans-serif); font-size: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
      <div style="width: 28px;"></div>
      <span id="multi-cap-2" style="font-weight: 600; color: var(--foreground);"></span>
      <button onclick="multiCalNext()" style="width: 28px; height: 28px; border-radius: var(--radius-small); border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--foreground);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <div id="multi-wd-2" style="display: grid; grid-template-columns: repeat(7, 32px); gap: 2px; margin-bottom: 4px;"></div>
    <div id="multi-grid-2" style="display: grid; grid-template-columns: repeat(7, 32px); gap: 2px;"></div>
  </div>

</div>

<script>
  const MC_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MC_DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const mcToday = new Date();
  let mcYear = mcToday.getFullYear(), mcMonth = mcToday.getMonth();

  function renderMCMonth(capId, wdId, gridId, year, month) {
    document.getElementById(capId).textContent = MC_MONTHS[month] + ' ' + year;
    const wd = document.getElementById(wdId);
    wd.innerHTML = '';
    MC_DAYS.forEach(d => { const el = document.createElement('div'); el.style.cssText = 'text-align:center;font-size:12px;color:var(--muted-foreground);padding:4px 0;'; el.textContent = d; wd.appendChild(el); });
    const grid = document.getElementById(gridId);
    grid.innerHTML = '';
    const first = new Date(year, month, 1).getDay();
    const dim = new Date(year, month + 1, 0).getDate();
    for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
    for (let d = 1; d <= dim; d++) {
      const btn = document.createElement('button');
      const isT = mcToday.getFullYear() === year && mcToday.getMonth() === month && mcToday.getDate() === d;
      btn.style.cssText = `width:32px;height:32px;border:none;font-size:13px;cursor:pointer;border-radius:4px;background:${isT?'var(--muted)':'transparent'};color:var(--foreground);font-weight:${isT?700:400};`;
      btn.textContent = d;
      grid.appendChild(btn);
    }
  }

  function renderMC() {
    renderMCMonth('multi-cap-1', 'multi-wd-1', 'multi-grid-1', mcYear, mcMonth);
    let m2 = mcMonth + 1, y2 = mcYear;
    if (m2 > 11) { m2 = 0; y2++; }
    renderMCMonth('multi-cap-2', 'multi-wd-2', 'multi-grid-2', y2, m2);
  }

  function multiCalPrev() { mcMonth--; if (mcMonth < 0) { mcMonth = 11; mcYear--; } renderMC(); }
  function multiCalNext() { mcMonth++; if (mcMonth > 11) { mcMonth = 0; mcYear++; } renderMC(); }

  renderMC();
</script>
