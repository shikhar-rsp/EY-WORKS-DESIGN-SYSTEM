<div style="display: flex; flex-direction: column; gap: 8px; font-family: 'Lexend', sans-serif;">

  <!-- Session -->
  <div style="display: flex; align-items: stretch; height: 54px; border-radius: var(--radius-xsmall); overflow: hidden;">
    <div style="width: 2px; background: var(--color-bg-brand-bold); border-radius: var(--radius-xsmall) 0 0 var(--radius-xsmall); flex-shrink: 0;"></div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: var(--color-bg-accent-orange-subtlest); padding: var(--space-100); border-radius: 0 var(--radius-small) var(--radius-small) 0;">
      <div style="display: flex; align-items: center; gap: var(--space-075);">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="color:var(--color-text); flex-shrink:0;"><circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M7 1v1.5M7 11.5V13M1 7h1.5M11.5 7H13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span style="font-size: 12px; font-weight: 500; color: var(--color-text);">Full Day Session</span>
      </div>
      <div style="display: flex; align-items: center; gap: var(--space-075);">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="color:var(--color-text-subtlest);flex-shrink:0;"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M7 4v3l2 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size: 12px; font-weight: 400; color: var(--color-text-subtlest);">8:30 to 7:30 am</span>
      </div>
    </div>
  </div>

  <!-- Event -->
  <div style="display: flex; align-items: stretch; height: 54px; border-radius: var(--radius-xsmall); overflow: hidden;">
    <div style="width: 2px; background: var(--color-icon-success); flex-shrink: 0;"></div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: var(--color-bg-accent-lime-subtlest); padding: var(--space-100);">
      <div style="display: flex; align-items: center; gap: var(--space-075);">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="color:var(--color-text);flex-shrink:0;"><rect x="1.5" y="2.5" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1.5 5.5h11M4.5 1v3M9.5 1v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span style="font-size: 12px; font-weight: 500; color: var(--color-text);">Event</span>
      </div>
      <div style="display: flex; align-items: center; gap: var(--space-075);">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="color:var(--color-text-subtlest);flex-shrink:0;"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M7 4v3l2 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size: 12px; color: var(--color-text-subtlest);">8:30 to 7:30 am</span>
      </div>
    </div>
  </div>

  <!-- Birthday -->
  <div style="display: flex; align-items: stretch; height: 32px; border-radius: var(--radius-xsmall); overflow: hidden;">
    <div style="width: 2px; background: var(--color-border-warning); flex-shrink: 0;"></div>
    <div style="flex: 1; display: flex; align-items: center; gap: var(--space-075); background: var(--color-bg-accent-yellow-subtlest); padding: var(--space-100);">
      <span style="font-size: 12px; font-weight: 500; color: var(--color-text);">Arthur's Birthday</span>
    </div>
  </div>

  <!-- Festival -->
  <div style="display: flex; align-items: stretch; height: 32px; border-radius: var(--radius-xsmall); overflow: hidden;">
    <div style="width: 2px; background: var(--color-border-accent-magenta); flex-shrink: 0;"></div>
    <div style="flex: 1; display: flex; align-items: center; gap: var(--space-075); background: var(--color-bg-accent-magenta-subtlest); padding: var(--space-100);">
      <span style="font-size: 12px; font-weight: 500; color: var(--color-text);">Festival</span>
    </div>
  </div>

  <!-- Leave -->
  <div style="display: flex; align-items: stretch; height: 32px; border-radius: var(--radius-xsmall); overflow: hidden;">
    <div style="width: 2px; background: var(--color-border-danger); flex-shrink: 0;"></div>
    <div style="flex: 1; display: flex; align-items: center; gap: var(--space-075); background: var(--color-bg-danger-hovered); padding: var(--space-100);">
      <span style="font-size: 12px; font-weight: 500; color: var(--color-text);">Leave</span>
    </div>
  </div>

</div>
