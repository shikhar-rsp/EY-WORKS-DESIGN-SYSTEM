<!-- Input date picker — disabled state -->
<button style="
  display: flex; align-items: center; width: 250px; height: 38px;
  border-radius: var(--radius-medium); border: 1px solid var(--border);
  background: var(--background); padding: 0 13px;
  font-family: var(--font-lexend, sans-serif); cursor: not-allowed; opacity: 0.5; gap: 8px;
" disabled>
  <span style="flex: 1; font-size: 16px; font-weight: 400; color: var(--placeholder); text-align: left;">
    Select date
  </span>
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="color: var(--muted-foreground); flex-shrink: 0;">
    <rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 7h12M5.5 1.5v3M10.5 1.5v3"/>
  </svg>
</button>
