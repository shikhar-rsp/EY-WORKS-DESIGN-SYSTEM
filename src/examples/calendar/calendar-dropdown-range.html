<!-- Calendar date-range dropdown — click start then end date -->
<style>
  .dr-wrap { display: flex; flex-direction: row; width: 560px; background: var(--background); border-radius: 6px 6px 0 0; box-shadow: 0 8px 16px rgba(0,0,0,0.15); overflow: hidden; font-family: var(--font-lexend, sans-serif); border: 1px solid var(--border); }
  .dr-panel { display: flex; flex-direction: column; width: 280px; }
  .dr-panel:first-child { border-right: 1px solid var(--border); }
  .dr-hdr { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 8px; border-bottom: 1px solid var(--border); }
  .dr-hdr-btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: var(--radius-small); background: transparent; cursor: pointer; }
  .dr-hdr-btn:hover { background: var(--muted); }
  .dr-lbl { font-size: 13px; font-weight: 600; color: var(--foreground); }
  .dr-wds { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 8px 0; }
  .dr-wd { text-align: center; font-size: 12px; color: var(--muted-foreground); padding: 4px 0; }
  .dr-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 4px 8px 8px; }
  .dr-day { height: 36px; border: none; border-radius: var(--radius-small); background: transparent; color: var(--foreground); font-size: 13px; cursor: pointer; }
  .dr-day:hover { background: var(--muted-hover); }
  .dr-day.today { background: var(--muted); font-weight: 700; }
  .dr-day.start,.dr-day.end { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
  .dr-day.in-range { background: var(--primary-subtle); }
</style>
<div class="dr-wrap">
  <div class="dr-panel">
    <div class="dr-hdr">
      <button class="dr-hdr-btn" onclick="drNav(-1)">&#8249;</button>
      <span class="dr-lbl" id="dr-lbl1"></span>
      <div style="width:28px"></div>
    </div>
    <div class="dr-wds" id="dr-wd1"></div>
    <div class="dr-grid" id="dr-grid1"></div>
  </div>
  <div class="dr-panel">
    <div class="dr-hdr">
      <div style="width:28px"></div>
      <span class="dr-lbl" id="dr-lbl2"></span>
      <button class="dr-hdr-btn" onclick="drNav(1)">&#8250;</button>
    </div>
    <div class="dr-wds" id="dr-wd2"></div>
    <div class="dr-grid" id="dr-grid2"></div>
  </div>
</div>
<script>
  const MONTHS_DR=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS_DR=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const todayDR=new Date();
  let drY=todayDR.getFullYear(),drM=todayDR.getMonth(),drStart=null,drEnd=null,drPickEnd=false;
  function drKey(y,m,d){return y*10000+m*100+d;}
  function drBuildPanel(wdId,gridId,year,month,prefix){
    const m2=month===11?0:month+1,y2=month===11?year+1:year;
    const wd=document.getElementById(wdId);wd.innerHTML='';
    DAYS_DR.forEach(d=>{const el=document.createElement('div');el.className='dr-wd';el.textContent=d;wd.appendChild(el);});
    const grid=document.getElementById(gridId);grid.innerHTML='';
    const first=new Date(year,month,1).getDay(),dim=new Date(year,month+1,0).getDate();
    for(let i=0;i<first;i++)grid.appendChild(document.createElement('div'));
    for(let d=1;d<=dim;d++){
      const btn=document.createElement('button');btn.className='dr-day';
      const isT=todayDR.getFullYear()===year&&todayDR.getMonth()===month&&todayDR.getDate()===d;
      if(isT)btn.classList.add('today');
      const k=drKey(year,month,d);
      if(drStart&&drEnd){const ks=drKey(drStart.y,drStart.m,drStart.d),ke=drKey(drEnd.y,drEnd.m,drEnd.d);if(k===ks)btn.classList.add('start');else if(k===ke)btn.classList.add('end');else if(k>ks&&k<ke)btn.classList.add('in-range');}
      else if(drStart&&k===drKey(drStart.y,drStart.m,drStart.d))btn.classList.add('start');
      btn.textContent=d;
      btn.onclick=()=>{if(!drPickEnd){drStart={y:year,m:month,d};drEnd=null;drPickEnd=true;}else{const k2=drKey(year,month,d),ks=drKey(drStart.y,drStart.m,drStart.d);if(k2>=ks){drEnd={y:year,m:month,d};}else{drEnd=drStart;drStart={y:year,m:month,d};}drPickEnd=false;}drRender();};
      grid.appendChild(btn);
    }
  }
  function drRender(){
    const m2=drM===11?0:drM+1,y2=drM===11?drY+1:drY;
    document.getElementById('dr-lbl1').textContent=MONTHS_DR[drM]+'  '+drY;
    document.getElementById('dr-lbl2').textContent=MONTHS_DR[m2]+'  '+y2;
    drBuildPanel('dr-wd1','dr-grid1',drY,drM,'p1');
    drBuildPanel('dr-wd2','dr-grid2',y2,m2,'p2');
  }
  function drNav(dir){drM+=dir;if(drM<0){drM=11;drY--;}if(drM>11){drM=0;drY++;}drRender();}
  drRender();
</script>
