<!-- Ranged input date picker — click to select start and end dates -->
<style>
  .cal-rng { position: relative; display: inline-block; }
  .cal-rng-input {
    display: inline-flex; align-items: center; width: 320px; height: 38px;
    border: 1px solid var(--border); border-radius: var(--radius-medium);
    background: var(--background); padding: 0 13px;
    font-family: var(--font-lexend, sans-serif); font-size: 14px; cursor: pointer; gap: 4px;
  }
  .cal-rng-input.opened { border: 2px solid var(--primary); }
  .cal-rng-part { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-rng-part.placeholder { color: var(--placeholder); }
  .cal-rng-part.filled { color: var(--foreground); }
  .cal-rng-sep { color: var(--muted-foreground); font-size: 16px; margin: 0 2px; }
  .cal-rng-popup {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15); background: var(--background);
    border: 1px solid var(--border); width: 280px;
  }
  .cal-rng-popup.open { display: block; }
  .rng-hdr { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 8px; border-bottom: 1px solid var(--border); }
  .rng-hdr-btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: var(--radius-small); background: transparent; cursor: pointer; }
  .rng-hdr-btn:hover { background: var(--muted); }
  .rng-lbl { font-size: 13px; font-weight: 600; color: var(--foreground); font-family: var(--font-lexend, sans-serif); }
  .rng-wds { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 8px 0; }
  .rng-wd { text-align: center; font-size: 12px; color: var(--muted-foreground); padding: 4px 0; font-family: var(--font-lexend, sans-serif); }
  .rng-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 4px 8px 8px; }
  .rng-day { height: 36px; border: none; border-radius: var(--radius-small); background: transparent; color: var(--foreground); font-size: 13px; cursor: pointer; }
  .rng-day:hover { background: var(--muted-hover); }
  .rng-day.today { background: var(--muted); font-weight: 700; }
  .rng-day.range-start,.rng-day.range-end { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
  .rng-day.in-range { background: var(--primary-subtle); color: var(--foreground); }
  .rng-hint { font-size: 11px; text-align: center; padding: 4px; color: var(--muted-foreground); font-family: var(--font-lexend, sans-serif); border-top: 1px solid var(--border); }
</style>
<div class="cal-rng" id="rng1">
  <button class="cal-rng-input" id="rng1-btn" onclick="rng1Toggle()">
    <span class="cal-rng-part placeholder" id="rng1-start">Start date</span>
    <span class="cal-rng-sep">~</span>
    <span class="cal-rng-part placeholder" id="rng1-end">End date</span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-left:4px;">
      <rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 7h12M5.5 1.5v3M10.5 1.5v3"/>
    </svg>
  </button>
  <div class="cal-rng-popup" id="rng1-popup">
    <div class="rng-hdr">
      <button class="rng-hdr-btn" onclick="rng1Nav(-1)">&#8249;</button>
      <span class="rng-lbl" id="rng1-lbl"></span>
      <button class="rng-hdr-btn" onclick="rng1Nav(1)">&#8250;</button>
    </div>
    <div class="rng-wds" id="rng1-wd"></div>
    <div class="rng-grid" id="rng1-grid"></div>
    <div class="rng-hint" id="rng1-hint">Click to select start date</div>
  </div>
</div>
<script>
  const MONTHS_RNG=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS_RNG=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const todayRNG=new Date();
  let rng1Y=todayRNG.getFullYear(),rng1M=todayRNG.getMonth(),rng1Start=null,rng1End=null,rng1Open=false,rng1PickEnd=false;
  function rng1Render(){
    document.getElementById('rng1-lbl').textContent=MONTHS_RNG[rng1M]+' '+rng1Y;
    document.getElementById('rng1-hint').textContent=rng1PickEnd?'Click to select end date':'Click to select start date';
    const wd=document.getElementById('rng1-wd');wd.innerHTML='';
    DAYS_RNG.forEach(d=>{const el=document.createElement('div');el.className='rng-wd';el.textContent=d;wd.appendChild(el);});
    const grid=document.getElementById('rng1-grid');grid.innerHTML='';
    const first=new Date(rng1Y,rng1M,1).getDay(),dim=new Date(rng1Y,rng1M+1,0).getDate();
    for(let i=0;i<first;i++)grid.appendChild(document.createElement('div'));
    for(let d=1;d<=dim;d++){
      const btn=document.createElement('button');btn.className='rng-day';
      const isT=todayRNG.getFullYear()===rng1Y&&todayRNG.getMonth()===rng1M&&todayRNG.getDate()===d;
      if(isT)btn.classList.add('today');
      if(rng1Start&&rng1End){if(d===rng1Start)btn.classList.add('range-start');else if(d===rng1End)btn.classList.add('range-end');else if(d>rng1Start&&d<rng1End)btn.classList.add('in-range');}
      else if(rng1Start&&d===rng1Start)btn.classList.add('range-start');
      btn.textContent=d;
      btn.onclick=()=>{
        if(!rng1PickEnd){rng1Start=d;rng1End=null;rng1PickEnd=true;const s=document.getElementById('rng1-start');s.textContent=String(d).padStart(2,'0')+'/'+(rng1M+1<10?'0':'')+(rng1M+1)+'/'+rng1Y;s.className='cal-rng-part filled';document.getElementById('rng1-end').textContent='End date';document.getElementById('rng1-end').className='cal-rng-part placeholder';}
        else{const end=d>rng1Start?d:rng1Start;const start=d<rng1Start?d:rng1Start;rng1Start=start;rng1End=end;rng1PickEnd=false;const e=document.getElementById('rng1-end');e.textContent=String(end).padStart(2,'0')+'/'+(rng1M+1<10?'0':'')+(rng1M+1)+'/'+rng1Y;e.className='cal-rng-part filled';rng1Open=false;document.getElementById('rng1-popup').classList.remove('open');document.getElementById('rng1-btn').classList.remove('opened');}
        rng1Render();
      };
      grid.appendChild(btn);
    }
  }
  function rng1Toggle(){rng1Open=!rng1Open;rng1PickEnd=false;document.getElementById('rng1-popup').classList.toggle('open',rng1Open);document.getElementById('rng1-btn').classList.toggle('opened',rng1Open);if(rng1Open)rng1Render();}
  function rng1Nav(dir){rng1M+=dir;if(rng1M<0){rng1M=11;rng1Y--;}if(rng1M>11){rng1M=0;rng1Y++;}rng1Render();}
  rng1Render();
</script>
