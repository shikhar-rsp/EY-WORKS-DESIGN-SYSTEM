<!-- Calendar with dropdown caption — see React tab for the interactive version -->
<div
  style="
    display: inline-block;
    border-radius: var(--radius-medium);
    border: 1px solid var(--border);
    background: var(--background);
    padding: 12px;
    font-family: var(--font-lexend, sans-serif);
    font-size: 14px;
  "
>
  <!-- Dropdown caption -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px;">
    <button onclick="ddPrev()" style="width: 28px; height: 28px; border-radius: var(--radius-small); border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--foreground);">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div style="display: flex; gap: 4px;">
      <select id="dd-month-sel" onchange="ddUpdateFromSelects()" style="border: 1px solid var(--border); border-radius: var(--radius-small); padding: 2px 4px; background: var(--background); color: var(--foreground); font-family: inherit; font-size: 13px;"></select>
      <select id="dd-year-sel" onchange="ddUpdateFromSelects()" style="border: 1px solid var(--border); border-radius: var(--radius-small); padding: 2px 4px; background: var(--background); color: var(--foreground); font-family: inherit; font-size: 13px;"></select>
    </div>
    <button onclick="ddNext()" style="width: 28px; height: 28px; border-radius: var(--radius-small); border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--foreground);">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
  <div id="dd-weekdays" style="display: grid; grid-template-columns: repeat(7, 32px); gap: 2px; margin-bottom: 4px;"></div>
  <div id="dd-grid" style="display: grid; grid-template-columns: repeat(7, 32px); gap: 2px;"></div>
</div>

<script>
  const DD_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DD_DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const today = new Date();
  let ddYear = today.getFullYear(), ddMonth = today.getMonth(), ddSelected = null;

  function initDDSelects() {
    const ms = document.getElementById('dd-month-sel');
    DD_MONTHS.forEach((m, i) => { const o = document.createElement('option'); o.value = i; o.textContent = m; if (i === ddMonth) o.selected = true; ms.appendChild(o); });
    const ys = document.getElementById('dd-year-sel');
    for (let y = 2020; y <= 2030; y++) { const o = document.createElement('option'); o.value = y; o.textContent = y; if (y === ddYear) o.selected = true; ys.appendChild(o); }
  }

  function renderDD() {
    document.getElementById('dd-month-sel').value = ddMonth;
    document.getElementById('dd-year-sel').value = ddYear;

    const wk = document.getElementById('dd-weekdays');
    wk.innerHTML = '';
    DD_DAYS.forEach(d => { const el = document.createElement('div'); el.style.cssText = 'text-align:center;font-size:12px;color:var(--muted-foreground);padding:4px 0;font-weight:500;'; el.textContent = d; wk.appendChild(el); });

    const grid = document.getElementById('dd-grid');
    grid.innerHTML = '';
    const first = new Date(ddYear, ddMonth, 1).getDay();
    const dim = new Date(ddYear, ddMonth + 1, 0).getDate();
    for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
    for (let d = 1; d <= dim; d++) {
      const btn = document.createElement('button');
      const isSel = ddSelected && ddSelected.year === ddYear && ddSelected.month === ddMonth && ddSelected.day === d;
      const isToday = today.getFullYear() === ddYear && today.getMonth() === ddMonth && today.getDate() === d;
      btn.style.cssText = `width:32px;height:32px;border:none;font-size:13px;cursor:pointer;border-radius:4px;background:${isSel?'var(--primary)':isToday?'var(--muted)':'transparent'};color:${isSel?'var(--primary-foreground)':'var(--foreground)'};`;
      btn.textContent = d;
      btn.onclick = () => { ddSelected = {year:ddYear,month:ddMonth,day:d}; renderDD(); };
      grid.appendChild(btn);
    }
  }

  function ddUpdateFromSelects() {
    ddMonth = parseInt(document.getElementById('dd-month-sel').value);
    ddYear = parseInt(document.getElementById('dd-year-sel').value);
    renderDD();
  }

  function ddPrev() { ddMonth--; if (ddMonth < 0) { ddMonth = 11; ddYear--; } renderDD(); }
  function ddNext() { ddMonth++; if (ddMonth > 11) { ddMonth = 0; ddYear++; } renderDD(); }

  initDDSelects();
  renderDD();
</script>
