<!-- Input date picker — prefilled, click to change -->
<style>
  .cal-dp-f { position: relative; display: inline-block; }
  .cal-dp-f-input {
    display: inline-flex; align-items: center; width: 250px; height: 38px;
    border: 1px solid var(--border); border-radius: var(--radius-medium);
    background: var(--background); padding: 0 13px;
    font-family: var(--font-lexend, sans-serif); font-size: 16px; cursor: pointer; gap: 8px;
  }
  .cal-dp-f-input.opened { border: 2px solid var(--primary); }
  .cal-dp-f-text { flex: 1; text-align: left; color: var(--foreground); }
  .cal-dp-f-popup {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15); background: var(--background);
    border: 1px solid var(--border); width: 280px;
  }
  .cal-dp-f-popup.open { display: block; }
  .dpf-hdr { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 8px; border-bottom: 1px solid var(--border); }
  .dpf-hdr-btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: var(--radius-small); background: transparent; cursor: pointer; }
  .dpf-hdr-btn:hover { background: var(--muted); }
  .dpf-lbl { font-size: 13px; font-weight: 600; color: var(--foreground); font-family: var(--font-lexend, sans-serif); }
  .dpf-wds { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 8px 0; }
  .dpf-wd { text-align: center; font-size: 12px; color: var(--muted-foreground); padding: 4px 0; font-family: var(--font-lexend, sans-serif); }
  .dpf-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 4px 8px 8px; }
  .dpf-day { height: 36px; border: none; border-radius: var(--radius-small); background: transparent; color: var(--foreground); font-size: 13px; cursor: pointer; }
  .dpf-day:hover { background: var(--muted-hover); }
  .dpf-day.today { background: var(--muted); font-weight: 700; }
  .dpf-day.selected { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
</style>
<div class="cal-dp-f" id="dpf">
  <button class="cal-dp-f-input" id="dpf-btn" onclick="dpfToggle()">
    <span class="cal-dp-f-text" id="dpf-text">30/10/2021</span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 7h12M5.5 1.5v3M10.5 1.5v3"/>
    </svg>
  </button>
  <div class="cal-dp-f-popup" id="dpf-popup">
    <div class="dpf-hdr">
      <button class="dpf-hdr-btn" onclick="dpfNav(-1)">&#8249;</button>
      <span class="dpf-lbl" id="dpf-lbl"></span>
      <button class="dpf-hdr-btn" onclick="dpfNav(1)">&#8250;</button>
    </div>
    <div class="dpf-wds" id="dpf-wd"></div>
    <div class="dpf-grid" id="dpf-grid"></div>
  </div>
</div>
<script>
  const MONTHS_DPF=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS_DPF=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const todayDPF=new Date();
  let dpfY=2021,dpfM=9,dpfSel=30,dpfOpen=false;
  function dpfRender(){
    document.getElementById('dpf-lbl').textContent=MONTHS_DPF[dpfM]+' '+dpfY;
    const wd=document.getElementById('dpf-wd');wd.innerHTML='';
    DAYS_DPF.forEach(d=>{const el=document.createElement('div');el.className='dpf-wd';el.textContent=d;wd.appendChild(el);});
    const grid=document.getElementById('dpf-grid');grid.innerHTML='';
    const first=new Date(dpfY,dpfM,1).getDay(),dim=new Date(dpfY,dpfM+1,0).getDate();
    for(let i=0;i<first;i++)grid.appendChild(document.createElement('div'));
    for(let d=1;d<=dim;d++){
      const btn=document.createElement('button');btn.className='dpf-day';
      const isT=todayDPF.getFullYear()===dpfY&&todayDPF.getMonth()===dpfM&&todayDPF.getDate()===d;
      if(isT)btn.classList.add('today');if(dpfSel===d)btn.classList.add('selected');
      btn.textContent=d;
      btn.onclick=()=>{dpfSel=d;document.getElementById('dpf-text').textContent=String(d).padStart(2,'0')+'/'+(dpfM+1<10?'0':'')+(dpfM+1)+'/'+dpfY;dpfOpen=false;document.getElementById('dpf-popup').classList.remove('open');document.getElementById('dpf-btn').classList.remove('opened');dpfRender();};
      grid.appendChild(btn);
    }
  }
  function dpfToggle(){dpfOpen=!dpfOpen;document.getElementById('dpf-popup').classList.toggle('open',dpfOpen);document.getElementById('dpf-btn').classList.toggle('opened',dpfOpen);if(dpfOpen)dpfRender();}
  function dpfNav(dir){dpfM+=dir;if(dpfM<0){dpfM=11;dpfY--;}if(dpfM>11){dpfM=0;dpfY++;}dpfRender();}
  dpfRender();
</script>
