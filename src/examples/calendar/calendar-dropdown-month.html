<!-- Calendar month picker — click a month name to select, use arrows to change year -->
<style>
  .dm-wrap { display: flex; flex-direction: column; width: 280px; background: var(--background); border-radius: 6px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); overflow: hidden; font-family: var(--font-lexend, sans-serif); border: 1px solid var(--border); }
  .dm-hdr { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 8px; border-bottom: 1px solid var(--border); }
  .dm-hdr-btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: var(--radius-small); background: transparent; cursor: pointer; }
  .dm-hdr-btn:hover { background: var(--muted); }
  .dm-lbl { font-size: 13px; font-weight: 600; color: var(--foreground); }
  .dm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 8px; padding: 16px; }
  .dm-cell { height: 36px; border: 1px solid var(--border); border-radius: var(--radius-small); background: transparent; color: var(--foreground); font-size: 13px; cursor: pointer; font-family: var(--font-lexend, sans-serif); }
  .dm-cell:hover { background: var(--muted-hover); }
  .dm-cell.selected { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); font-weight: 600; }
</style>
<div class="dm-wrap">
  <div class="dm-hdr">
    <button class="dm-hdr-btn" onclick="dmNav(-1)">&#8249;</button>
    <span class="dm-lbl" id="dm-lbl">2021</span>
    <button class="dm-hdr-btn" onclick="dmNav(1)">&#8250;</button>
  </div>
  <div class="dm-grid" id="dm-grid"></div>
</div>
<script>
  const MONTHS_DM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let dmY=2021,dmSel=9;
  function dmRender(){
    document.getElementById('dm-lbl').textContent=dmY;
    const grid=document.getElementById('dm-grid');grid.innerHTML='';
    MONTHS_DM.forEach((m,i)=>{const btn=document.createElement('button');btn.className='dm-cell'+(i===dmSel?' selected':'');btn.textContent=m;btn.onclick=()=>{dmSel=i;dmRender();};grid.appendChild(btn);});
  }
  function dmNav(dir){dmY+=dir;dmRender();}
  dmRender();
</script>
