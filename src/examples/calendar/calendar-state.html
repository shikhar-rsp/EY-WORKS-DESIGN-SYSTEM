<div style="display: flex; flex-direction: column; gap: 8px; font-family: 'Lexend', sans-serif;">

  <!-- Holiday -->
  <div style="display:flex;align-items:center;width:144px;height:24px;border-left:3px solid var(--color-border-accent-magenta);background:var(--color-bg-accent-magenta-subtlest);padding:0 12px;border-radius:var(--radius-xsmall);">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0;margin-right:5px;"><path d="M1 10.5C2.5 9 4.5 8 6 8c1.5 0 3.5 1 5 2.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><circle cx="6" cy="4.5" r="2" stroke="currentColor" stroke-width="1.1"/></svg>
    <span style="font-size:12px;color:var(--color-text);white-space:nowrap;">Christmas</span>
  </div>

  <!-- Sick Leave -->
  <div style="display:flex;align-items:center;width:144px;height:24px;border-left:3px solid var(--color-border-danger);background:var(--color-bg-danger-hovered);padding:0 12px;border-radius:var(--radius-xsmall);">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0;margin-right:5px;"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.1"/><path d="M4 8s.667-1 2-1 2 1 2 1" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
    <span style="font-size:12px;color:var(--color-text);white-space:nowrap;">Sick Leave</span>
  </div>

  <!-- Birthday -->
  <div style="display:flex;align-items:center;width:144px;height:24px;border-left:3px solid var(--color-border-warning);background:var(--color-bg-accent-yellow-subtlest);padding:0 12px;border-radius:var(--radius-xsmall);">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0;margin-right:5px;"><path d="M2 6h8v3.5a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V6Z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="font-size:12px;color:var(--color-text);white-space:nowrap;">Arthur's Birthday</span>
  </div>

  <!-- Event -->
  <div style="display:flex;align-items:center;width:144px;height:24px;border-left:3px solid var(--color-text-information);background:var(--color-bg-accent-blue-subtlest);padding:0 12px;border-radius:var(--radius-xsmall);">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0;margin-right:5px;"><rect x="1.5" y="2" width="9" height="8.5" rx="1.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="font-size:12px;color:var(--color-text);white-space:nowrap;">Event</span>
  </div>

  <!-- Room Movement -->
  <div style="display:flex;align-items:center;width:144px;height:24px;border-left:3px solid var(--color-border-accent-teal);background:var(--color-bg-accent-teal-subtlest);padding:0 12px;border-radius:var(--radius-xsmall);">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0;margin-right:5px;"><path d="M2 6h8M7.5 3.5 10 6l-2.5 2.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="font-size:12px;color:var(--color-text);white-space:nowrap;">Room Movement</span>
  </div>

</div>
