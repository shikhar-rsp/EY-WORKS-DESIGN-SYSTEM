<!-- Input date picker — click to open/close a date grid -->
<style>
  .cal-dp { position: relative; display: inline-block; }
  .cal-dp-input {
    display: inline-flex; align-items: center; width: 250px; height: 38px;
    border: 1px solid var(--border); border-radius: var(--radius-medium);
    background: var(--background); padding: 0 13px;
    font-family: var(--font-lexend, sans-serif); font-size: 16px; cursor: pointer; gap: 8px;
  }
  .cal-dp-input.opened { border: 2px solid var(--primary); }
  .cal-dp-text { flex: 1; text-align: left; color: var(--placeholder); }
  .cal-dp-text.filled { color: var(--foreground); }
  .cal-dp-popup {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15); background: var(--background);
    border: 1px solid var(--border); width: 280px;
  }
  .cal-dp-popup.open { display: block; }
  .cal-hdr { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 8px; border-bottom: 1px solid var(--border); }
  .cal-hdr-btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: var(--radius-small); background: transparent; cursor: pointer; }
  .cal-hdr-btn:hover { background: var(--muted); }
  .cal-lbl { font-size: 13px; font-weight: 600; color: var(--foreground); font-family: var(--font-lexend, sans-serif); }
  .cal-wds { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 8px 0; }
  .cal-wd { text-align: center; font-size: 12px; color: var(--muted-foreground); padding: 4px 0; font-family: var(--font-lexend, sans-serif); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 4px 8px 8px; }
  .cal-day { height: 36px; border: none; border-radius: var(--radius-small); background: transparent; color: var(--foreground); font-size: 13px; cursor: pointer; }
  .cal-day:hover { background: var(--muted-hover); }
  .cal-day.today { background: var(--muted); font-weight: 700; }
  .cal-day.selected { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
</style>
<div class="cal-dp" id="dp1">
  <button class="cal-dp-input" id="dp1-btn" onclick="dp1Toggle()">
    <span class="cal-dp-text" id="dp1-text">Select date</span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 7h12M5.5 1.5v3M10.5 1.5v3"/>
    </svg>
  </button>
  <div class="cal-dp-popup" id="dp1-popup">
    <div class="cal-hdr">
      <button class="cal-hdr-btn" onclick="dp1Nav(-1)">&#8249;</button>
      <span class="cal-lbl" id="dp1-lbl"></span>
      <button class="cal-hdr-btn" onclick="dp1Nav(1)">&#8250;</button>
    </div>
    <div class="cal-wds" id="dp1-wd"></div>
    <div class="cal-grid" id="dp1-grid"></div>
  </div>
</div>
<script>
  const MONTHS_DP = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS_DP = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const todayDP = new Date();
  let dp1Y = todayDP.getFullYear(), dp1M = todayDP.getMonth(), dp1Sel = null, dp1Open = false;

  function dp1Render() {
    document.getElementById('dp1-lbl').textContent = MONTHS_DP[dp1M] + ' ' + dp1Y;
    const wd = document.getElementById('dp1-wd'); wd.innerHTML = '';
    DAYS_DP.forEach(d => { const el = document.createElement('div'); el.className='cal-wd'; el.textContent=d; wd.appendChild(el); });
    const grid = document.getElementById('dp1-grid'); grid.innerHTML = '';
    const first = new Date(dp1Y, dp1M, 1).getDay();
    const dim = new Date(dp1Y, dp1M+1, 0).getDate();
    for (let i=0;i<first;i++) grid.appendChild(document.createElement('div'));
    for (let d=1;d<=dim;d++) {
      const btn = document.createElement('button'); btn.className='cal-day';
      const isT = todayDP.getFullYear()===dp1Y && todayDP.getMonth()===dp1M && todayDP.getDate()===d;
      if (isT) btn.classList.add('today');
      if (dp1Sel===d) btn.classList.add('selected');
      btn.textContent = d;
      btn.onclick = () => {
        dp1Sel = d;
        const tx = document.getElementById('dp1-text');
        tx.textContent = String(d).padStart(2,'0')+'/'+(dp1M+1<10?'0':'')+(dp1M+1)+'/'+dp1Y;
        tx.className = 'cal-dp-text filled';
        dp1Open = false;
        document.getElementById('dp1-popup').classList.remove('open');
        document.getElementById('dp1-btn').classList.remove('opened');
        dp1Render();
      };
      grid.appendChild(btn);
    }
  }
  function dp1Toggle() { dp1Open=!dp1Open; document.getElementById('dp1-popup').classList.toggle('open',dp1Open); document.getElementById('dp1-btn').classList.toggle('opened',dp1Open); if(dp1Open) dp1Render(); }
  function dp1Nav(dir) { dp1M+=dir; if(dp1M<0){dp1M=11;dp1Y--;} if(dp1M>11){dp1M=0;dp1Y++;} dp1Render(); }
  dp1Render();
</script>
