<!-- Radio Group — default vertical -->
<div role="radiogroup" style="display: flex; flex-direction: column; gap: var(--space-100);">
  <label style="display: inline-flex; align-items: center; gap: var(--space-100); cursor: pointer; font-family: var(--font-lexend, sans-serif); font-size: 14px; color: var(--foreground);">
    <button
      type="button"
      role="radio"
      aria-checked="false"
      style="
        width: 16px; height: 16px; border-radius: 50%;
        border: 1.5px solid var(--border-input);
        background: var(--background);
        display: inline-flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
      "
    ></button>
    Default
  </label>
  <label style="display: inline-flex; align-items: center; gap: var(--space-100); cursor: pointer; font-family: var(--font-lexend, sans-serif); font-size: 14px; color: var(--foreground);">
    <button
      type="button"
      role="radio"
      aria-checked="true"
      style="
        width: 16px; height: 16px; border-radius: 50%;
        border: 1.5px solid var(--primary);
        background: var(--background);
        display: inline-flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
      "
    >
      <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--primary); display: block;"></span>
    </button>
    Comfortable
  </label>
  <label style="display: inline-flex; align-items: center; gap: var(--space-100); cursor: pointer; font-family: var(--font-lexend, sans-serif); font-size: 14px; color: var(--foreground);">
    <button
      type="button"
      role="radio"
      aria-checked="false"
      style="
        width: 16px; height: 16px; border-radius: 50%;
        border: 1.5px solid var(--border-input);
        background: var(--background);
        display: inline-flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
      "
    ></button>
    Spacious
  </label>
</div>
