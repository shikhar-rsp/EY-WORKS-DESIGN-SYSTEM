<!-- RadioGroup — horizontal orientation -->
<div
  role="radiogroup"
  aria-label="Spacing options"
  style="display: flex; flex-direction: row; flex-wrap: wrap; gap: var(--space-300); font-family: var(--font-lexend, sans-serif);"
>
  <!-- Default (unchecked) -->
  <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--foreground);">
    <button
      type="button"
      role="radio"
      aria-checked="false"
      data-state="unchecked"
      style="
        position: relative; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
        width: 14px; height: 14px; border-radius: 50%;
        border: 1px solid var(--border-input); background: var(--background);
        cursor: pointer; transition: background 150ms;
      "
    ></button>
    Default
  </label>

  <!-- Comfortable (checked) -->
  <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--foreground);">
    <button
      type="button"
      role="radio"
      aria-checked="true"
      data-state="checked"
      style="
        position: relative; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
        width: 14px; height: 14px; border-radius: 50%;
        border: 0; background: var(--primary);
        cursor: pointer; transition: background 150ms;
      "
    >
      <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--primary-foreground);"></span>
    </button>
    Comfortable
  </label>

  <!-- Spacious (unchecked) -->
  <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--foreground);">
    <button
      type="button"
      role="radio"
      aria-checked="false"
      data-state="unchecked"
      style="
        position: relative; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
        width: 14px; height: 14px; border-radius: 50%;
        border: 1px solid var(--border-input); background: var(--background);
        cursor: pointer; transition: background 150ms;
      "
    ></button>
    Spacious
  </label>
</div>
