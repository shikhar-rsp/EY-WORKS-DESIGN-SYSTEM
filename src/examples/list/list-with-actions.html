<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>List With Actions</title>
</head>
<body>
  <ul
    style="
      width: 100%; max-width: 448px;
      font-family: var(--font-lexend, 'Lexend', sans-serif);
      list-style: none; margin: 0; padding: 0;
    "
  >
    <li
      style="
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px;
        background: var(--background, #ffffff);
      "
    >
      <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary, #f8785e); flex-shrink: 0;"></div>
      <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <p style="font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Jane Doe</p>
        <p style="font-size: 12px; color: var(--muted-foreground, #7a7272); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Product Designer</p>
      </div>
      <div style="display: flex; flex-shrink: 0; align-items: center; gap: 8px;">
        <button
          style="
            padding: 4px 12px; font-size: 12px;
            font-family: var(--font-lexend, 'Lexend', sans-serif); font-weight: 500;
            border-radius: var(--radius-medium, 8px);
            border: 1px solid var(--border, #ebe9e8);
            background: var(--background, #ffffff);
            color: var(--foreground, #2e2b2b); cursor: pointer;
          "
        >Edit</button>
      </div>
    </li>
    <li
      style="
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px;
        background: var(--background, #ffffff);
        border-top: 1px solid var(--border, #ebe9e8);
      "
    >
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #3bbfb2; flex-shrink: 0;"></div>
      <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <p style="font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Marcus Lee</p>
        <p style="font-size: 12px; color: var(--muted-foreground, #7a7272); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Frontend Engineer</p>
      </div>
      <div style="display: flex; flex-shrink: 0; align-items: center; gap: 8px;">
        <button
          style="
            padding: 4px 12px; font-size: 12px;
            font-family: var(--font-lexend, 'Lexend', sans-serif); font-weight: 500;
            border-radius: var(--radius-medium, 8px);
            border: 1px solid var(--border, #ebe9e8);
            background: var(--background, #ffffff);
            color: var(--foreground, #2e2b2b); cursor: pointer;
          "
        >Edit</button>
      </div>
    </li>
    <li
      style="
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px;
        background: var(--background, #ffffff);
        border-top: 1px solid var(--border, #ebe9e8);
      "
    >
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #9b87f5; flex-shrink: 0;"></div>
      <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <p style="font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Sofia Reyes</p>
        <p style="font-size: 12px; color: var(--muted-foreground, #7a7272); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Engineering Manager</p>
      </div>
      <div style="display: flex; flex-shrink: 0; align-items: center; gap: 8px;">
        <button
          style="
            padding: 4px 12px; font-size: 12px;
            font-family: var(--font-lexend, 'Lexend', sans-serif); font-weight: 500;
            border-radius: var(--radius-medium, 8px);
            border: 1px solid var(--border, #ebe9e8);
            background: var(--background, #ffffff);
            color: var(--foreground, #2e2b2b); cursor: pointer;
          "
        >Edit</button>
      </div>
    </li>
  </ul>
</body>
</html>
