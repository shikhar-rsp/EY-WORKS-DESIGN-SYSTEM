<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>List Default</title>
</head>
<body>
  <ul
    style="
      width: 100%; max-width: 448px;
      font-family: var(--font-lexend, 'Lexend', sans-serif);
      list-style: none; margin: 0; padding: 0;
    "
  >
    <li
      style="
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px;
        background: var(--background, #ffffff);
      "
    >
      <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <p style="font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Invoice #1042</p>
        <p style="font-size: 12px; color: var(--muted-foreground, #7a7272); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Sent on April 3, 2026 · $240.00</p>
      </div>
    </li>
    <li
      style="
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px;
        background: var(--background, #ffffff);
        border-top: 1px solid var(--border, #ebe9e8);
      "
    >
      <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <p style="font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Invoice #1043</p>
        <p style="font-size: 12px; color: var(--muted-foreground, #7a7272); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Sent on April 7, 2026 · $120.00</p>
      </div>
    </li>
    <li
      style="
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px;
        background: var(--background, #ffffff);
        border-top: 1px solid var(--border, #ebe9e8);
      "
    >
      <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <p style="font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Invoice #1044</p>
        <p style="font-size: 12px; color: var(--muted-foreground, #7a7272); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Sent on April 10, 2026 · $360.00</p>
      </div>
    </li>
  </ul>
</body>
</html>
