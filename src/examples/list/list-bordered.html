<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>List Bordered</title>
</head>
<body>
  <div style="max-width: 448px; font-family: var(--font-lexend, 'Lexend', sans-serif);">
    <!-- ListHeader -->
    <div
      style="
        padding: 12px 16px;
        font-size: 14px; font-weight: 600;
        color: var(--foreground, #2e2b2b);
        border: 1px solid var(--border, #ebe9e8);
        border-bottom: none;
        border-radius: var(--radius-large, 16px) var(--radius-large, 16px) 0 0;
        background: var(--background, #ffffff);
      "
    >
      Recent Activity
    </div>

    <!-- List (bordered) -->
    <ul
      style="
        width: 100%; list-style: none; margin: 0; padding: 0;
        border: 1px solid var(--border, #ebe9e8);
        border-top: none; border-bottom: none;
      "
    >
      <li
        style="
          display: flex; align-items: center; gap: 12px;
          padding: 12px 16px;
          background: var(--background, #ffffff);
        "
      >
        <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <p style="font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Component synced from Figma</p>
          <p style="font-size: 12px; color: var(--muted-foreground, #7a7272); margin: 0;">Button · 2 minutes ago</p>
        </div>
      </li>
      <li
        style="
          display: flex; align-items: center; gap: 12px;
          padding: 12px 16px;
          background: var(--background, #ffffff);
          border-top: 1px solid var(--border, #ebe9e8);
        "
      >
        <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <p style="font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Docs page generated</p>
          <p style="font-size: 12px; color: var(--muted-foreground, #7a7272); margin: 0;">List · 10 minutes ago</p>
        </div>
      </li>
      <li
        style="
          display: flex; align-items: center; gap: 12px;
          padding: 12px 16px;
          background: var(--background, #ffffff);
          border-top: 1px solid var(--border, #ebe9e8);
        "
      >
        <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <p style="font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Design token updated</p>
          <p style="font-size: 12px; color: var(--muted-foreground, #7a7272); margin: 0;">primary · 1 hour ago</p>
        </div>
      </li>
    </ul>

    <!-- ListFooter -->
    <div
      style="
        padding: 12px 16px;
        font-size: 12px;
        color: var(--muted-foreground, #7a7272);
        border: 1px solid var(--border, #ebe9e8);
        border-top: none;
        border-radius: 0 0 var(--radius-large, 16px) var(--radius-large, 16px);
        background: var(--background, #ffffff);
      "
    >
      Showing 3 of 24 events
    </div>
  </div>
</body>
</html>
