<style>
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .saving-spinner {
    animation: spin 1s linear infinite;
  }
</style>

<div
  style="
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius-large);
    overflow: hidden;
  "
>
  <div
    style="
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      border-radius: var(--radius-large);
      background: var(--background);
      padding: var(--space-100) var(--space-150);
    "
  >
    <!-- Left: Title + Helper -->
    <div
      style="
        display: flex;
        flex-direction: column;
        gap: var(--space-050);
        align-items: flex-start;
        justify-content: center;
        padding: var(--space-100) 0;
      "
    >
      <p
        style="
          font-family: var(--font-lexend), sans-serif;
          font-size: 14px;
          font-weight: 500;
          line-height: 20px;
          color: var(--foreground);
          margin: 0;
        "
      >
        New Child Profile
      </p>
      <p
        style="
          font-family: var(--font-lexend), sans-serif;
          font-size: 14px;
          line-height: 20px;
          color: var(--subtlest);
          margin: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        "
      >
        Fill in the details below
      </p>
    </div>

    <!-- Right: Actions -->
    <div style="display: flex; align-items: flex-end; gap: var(--space-200);">
      <!-- Saving indicator (hidden by default, toggled via button click) -->
      <div
        id="saving-indicator"
        style="
          display: none;
          align-items: center;
          gap: var(--space-100);
          min-width: 40px;
          border-radius: var(--radius-medium);
          padding: var(--space-100) var(--space-200);
        "
      >
        <span
          style="
            font-family: var(--font-lexend), sans-serif;
            font-size: 14px;
            line-height: 20px;
            color: var(--muted-foreground);
          "
        >
          Saving...
        </span>
        <svg
          class="saving-spinner"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          style="color: var(--muted-foreground);"
        >
          <path
            d="M12 3C16.9706 3 21 7.02944 21 12"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <!-- Reset fields -->
      <button
        onclick="
          var indicator = document.getElementById('saving-indicator');
          indicator.style.display = 'flex';
          setTimeout(function() { indicator.style.display = 'none'; }, 2000);
        "
        style="
          display: flex;
          align-items: center;
          gap: var(--space-100);
          min-width: 40px;
          border-radius: var(--radius-medium);
          border: 1px solid var(--primary);
          background: var(--background);
          padding: var(--space-100) var(--space-200);
          font-family: var(--font-lexend), sans-serif;
          font-size: 14px;
          line-height: 20px;
          color: var(--primary);
          cursor: pointer;
        "
        onmouseover="this.style.background='var(--primary-subtlest)'"
        onmouseout="this.style.background='var(--background)'"
      >
        Reset fields
      </button>

      <!-- Close -->
      <button
        style="
          display: flex;
          align-items: center;
          gap: var(--space-100);
          min-width: 40px;
          border-radius: var(--radius-medium);
          border: 1px solid var(--primary);
          background: var(--background);
          padding: var(--space-100) var(--space-200);
          font-family: var(--font-lexend), sans-serif;
          font-size: 14px;
          line-height: 20px;
          color: var(--primary);
          cursor: pointer;
        "
        onmouseover="this.style.background='var(--primary-subtlest)'"
        onmouseout="this.style.background='var(--background)'"
      >
        Close
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          style="color: var(--primary);"
        >
          <path
            d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M14.5 9.5L9.5 14.5M9.5 9.5L14.5 14.5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
