<style>
  .profile-card { display: flex; flex-direction: column; align-items: center; width: 244px; border-radius: 12px; background: var(--background, #ffffff); box-shadow: 0px 8px 16px rgba(0,0,0,0.08); overflow: hidden; }
  .profile-card--focused { border: 4px solid var(--ring, #8290dd); }
  .profile-card__cover { position: relative; height: 128px; width: 100%; flex-shrink: 0; }
  .profile-card__photo { position: absolute; left: 50%; top: 50%; width: 236px; height: 120px; transform: translate(-50%, -50%); border-radius: var(--radius-medium, 8px); overflow: hidden; }
  .profile-card__photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .profile-card__overlay { position: absolute; left: 50%; top: 50%; width: 220px; height: 112px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .profile-card__checkbox-row { display: flex; height: 32px; width: 100%; align-items: flex-start; }
  .profile-card__checkbox { width: 16px; height: 16px; border-radius: var(--radius-small, 4px); border: 1.5px solid var(--border, #ebe9e8); background: var(--background, #ffffff); cursor: pointer; }
  .profile-card__badges-row { display: flex; width: 100%; align-items: center; justify-content: flex-end; }
  .profile-card__funding { display: flex; height: 24px; align-items: center; gap: 4px; border-radius: var(--radius-small, 4px); background: var(--accent-lime, #ecfccb); padding: 0 4px; }
  .profile-card__funding-label { font-family: 'Lexend', sans-serif; font-size: 12px; font-weight: 400; line-height: 16px; color: var(--accent-lime-foreground, #3f6212); white-space: nowrap; }
  .profile-card__details { display: flex; width: 100%; flex-direction: column; gap: 8px; padding: 0 8px 12px; }
  .profile-card__name { font-family: 'Lexend', sans-serif; font-size: 15px; font-weight: 600; line-height: 22px; color: var(--foreground, #2e2b2b); }
  .profile-card__meta { display: flex; flex-direction: column; gap: 4px; }
  .profile-card__meta-row { display: flex; align-items: center; gap: 4px; }
  .profile-card__meta-text { font-family: 'Lexend', sans-serif; font-size: 12px; font-weight: 400; line-height: 16px; color: var(--subtlest, #ada5a5); }
  .profile-card__schedule { display: flex; width: 100%; align-items: center; justify-content: space-between; }
  .lozenge { display: flex; align-items: center; justify-content: center; padding: 2px 6px; border-radius: var(--radius-small, 4px); font-family: 'Lexend', sans-serif; font-size: 11px; font-weight: 500; }
  .lozenge--blue { background: var(--accent-blue, #d7e8ff); color: var(--info, #2d70cf); }
  .lozenge--grey { background: var(--accent-gray-subtler, #f4f4f4); color: var(--muted-foreground, #7a7272); }
  .profile-card__tags { display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-full, 99px); background: var(--muted, #fafafa); font-family: 'Lexend', sans-serif; font-size: 12px; font-weight: 400; color: var(--muted-foreground, #7a7272); }
</style>
