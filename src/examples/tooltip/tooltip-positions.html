<style>
  .tp-wrap { position: relative; display: inline-block; }
  .tp-btn {
    padding: 8px 16px; border-radius: var(--radius-medium);
    border: 1px solid var(--border); background: var(--background);
    font-family: var(--font-lexend), sans-serif; font-size: 14px;
    color: var(--foreground); cursor: pointer;
  }
  .tp-tip {
    position: absolute; z-index: 50;
    background: var(--primary); color: var(--primary-foreground);
    border-radius: var(--radius-small); padding: 2px 6px;
    font-family: var(--font-lexend), sans-serif; font-size: 12px;
    white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.15s;
  }
  .tp-wrap:hover .tp-tip { opacity: 1; }
  .tp-top { bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); }
  .tp-bottom { top: calc(100% + 4px); left: 50%; transform: translateX(-50%); }
  .tp-left { right: calc(100% + 4px); top: 50%; transform: translateY(-50%); }
  .tp-right { left: calc(100% + 4px); top: 50%; transform: translateY(-50%); }
</style>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px; padding: 32px;">
  <div class="tp-wrap">
    <button class="tp-btn" type="button">top</button>
    <div class="tp-tip tp-top" role="tooltip">Tooltip top</div>
  </div>
  <div class="tp-wrap">
    <button class="tp-btn" type="button">right</button>
    <div class="tp-tip tp-right" role="tooltip">Tooltip right</div>
  </div>
  <div class="tp-wrap">
    <button class="tp-btn" type="button">bottom</button>
    <div class="tp-tip tp-bottom" role="tooltip">Tooltip bottom</div>
  </div>
  <div class="tp-wrap">
    <button class="tp-btn" type="button">left</button>
    <div class="tp-tip tp-left" role="tooltip">Tooltip left</div>
  </div>
</div>
