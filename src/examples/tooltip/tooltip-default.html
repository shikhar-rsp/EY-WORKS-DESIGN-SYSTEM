<style>
  .tooltip-wrap { position: relative; display: inline-block; }
  .tooltip-tip {
    position: absolute;
    bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
    background: var(--primary); color: var(--primary-foreground);
    border-radius: var(--radius-small); padding: 2px 6px;
    font-family: var(--font-lexend), sans-serif; font-size: 12px; line-height: 1.4;
    white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.15s;
  }
  .tooltip-tip::after {
    content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: var(--primary);
  }
  .tooltip-wrap:hover .tooltip-tip { opacity: 1; }
  .tooltip-trigger {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 4px 8px; border-radius: var(--radius-medium);
    border: 1px solid var(--border); background: var(--background);
    font-family: var(--font-lexend), sans-serif; font-size: 14px;
    color: var(--foreground); cursor: pointer;
  }
</style>
<div class="tooltip-wrap">
  <button class="tooltip-trigger" type="button">Hover me</button>
  <div class="tooltip-tip" role="tooltip">Add to library</div>
</div>
