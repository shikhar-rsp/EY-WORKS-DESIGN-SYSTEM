<style>
  .delay-wrap { position: relative; display: inline-block; }
  .delay-btn {
    padding: 8px 16px; border-radius: var(--radius-medium);
    border: 1px solid var(--border); background: var(--background);
    font-family: var(--font-lexend), sans-serif; font-size: 14px;
    color: var(--foreground); cursor: pointer;
  }
  .delay-tip {
    position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
    background: var(--primary); color: var(--primary-foreground);
    border-radius: var(--radius-small); padding: 2px 6px;
    font-family: var(--font-lexend), sans-serif; font-size: 12px;
    white-space: nowrap; pointer-events: none; z-index: 50;
    opacity: 0; transition: opacity 0.15s 500ms;
  }
  .delay-wrap:hover .delay-tip { opacity: 1; }
</style>
<div class="delay-wrap">
  <button class="delay-btn" type="button">Hover (500ms delay)</button>
  <div class="delay-tip" role="tooltip">Appears after delay</div>
</div>
