<div style="
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start; width: 100%;
  background: var(--color-bg-disabled); border: 1px solid var(--color-border);
  border-radius: var(--radius-medium); padding: var(--space-150);
">
  <div style="display: flex; flex-direction: column; gap: var(--space-150); align-items: flex-start; width: 100%;">

    <!-- Info row -->
    <div style="display: flex; align-items: flex-start; justify-content: space-between; width: 100%;">
      <div style="display: flex; align-items: center; gap: var(--space-075);">
        <div style="
          display: flex; align-items: center; padding: var(--space-100);
          border: 1px solid var(--color-border); border-radius: var(--radius-medium);
          background: var(--color-bg-disabled); flex-shrink: 0;
        ">
          <span style="color: var(--color-icon-subtle); display: inline-flex;">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.667 1.667H5a1.667 1.667 0 0 0-1.667 1.666v13.334A1.667 1.667 0 0 0 5 18.333h10A1.667 1.667 0 0 0 16.667 17V6.667L11.667 1.667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M11.667 1.667v5h5M8.333 10.833h3.334M8.333 13.333h3.334M6.667 8.333h.833" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0; align-items: flex-start; width: 222px;">
          <p style="font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 400; line-height: 20px; color: var(--color-text); white-space: nowrap;">
            Upload_File.pdf
          </p>
          <div style="display: flex; align-items: center; gap: var(--space-100); width: 100%;">
            <span style="font-family: 'Lexend', sans-serif; font-size: 12px; font-weight: 400; line-height: 16px; color: var(--color-text-subtlest); white-space: nowrap;">
              60 KB of 18MB:
            </span>
            <div style="display: flex; align-items: center; gap: var(--space-050);">
              <span style="color: var(--color-icon-danger); display: inline-flex;">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="8" cy="8" r="6.667" stroke="currentColor" stroke-width="1.333" stroke-linecap="round"/>
                  <path d="M8 5.333V8M8 10.667h.007" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span style="font-family: 'Lexend', sans-serif; font-size: 12px; font-weight: 400; line-height: 16px; color: var(--color-text-danger);">Error...</span>
            </div>
          </div>
        </div>
      </div>
      <button style="color: var(--color-icon-subtle); background: none; border: none; cursor: pointer; display: inline-flex; flex-shrink: 0;" aria-label="Cancel">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10.5 3.5 3.5 10.5M3.5 3.5l7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Progress bar (partial, red) -->
    <div style="background: var(--color-bg-neutral-hovered); width: 100%; height: 4px; border-radius: var(--radius-large); overflow: hidden; flex-shrink: 0;">
      <div style="background: var(--color-text-danger); height: 100%; border-radius: var(--radius-large); width: 30%;"></div>
    </div>

  </div>

  <!-- Error message -->
  <p style="font-size: 10px; line-height: 1.4; color: var(--color-text-accent-red); font-weight: 400; white-space: nowrap;">
    This document is not supported, please delete and upload another file.
  </p>
</div>
