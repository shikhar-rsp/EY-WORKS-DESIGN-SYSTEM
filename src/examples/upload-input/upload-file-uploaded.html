<div style="display: flex; flex-direction: column; gap: var(--space-150); align-items: flex-start; width: 100%;">

  <!-- Header -->
  <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start; width: 100%;">
    <p style="font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 400; line-height: 20px; color: var(--color-text); white-space: nowrap;">
      Import Child Profile
    </p>
    <p style="font-family: 'Lexend', sans-serif; font-size: 16px; font-weight: 400; line-height: 24px; color: var(--color-text-subtlest);">
      Acceptable file type: CSV. Max Size: 5MB
    </p>
  </div>

  <!-- Uploaded area -->
  <div style="
    display: flex; flex-direction: column; gap: var(--space-150);
    align-items: flex-start; width: 100%;
    border-radius: var(--radius-medium);
    border: 1px dashed var(--color-border-focused);
    background: var(--color-bg-accent-purple-subtlest);
    padding: var(--space-150);
  ">
    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
      <span style="font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 400; line-height: 20px; color: var(--color-text);">
        Report_2024.csv
      </span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button style="
          display: inline-flex; align-items: center; justify-content: center;
          height: 32px; min-width: 40px; padding: var(--space-100) var(--space-200);
          border-radius: var(--radius-medium); border: 1px solid var(--color-border-danger);
          background: transparent; color: var(--color-text-danger);
          font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 400; line-height: 20px;
          cursor: pointer;
        ">Delete</button>
        <button style="
          display: inline-flex; align-items: center; justify-content: center; gap: var(--space-100);
          height: 32px; min-width: 40px; padding: var(--space-100) var(--space-200);
          border-radius: var(--radius-medium); border: 1px solid transparent;
          background: var(--color-bg-brand-bold); color: var(--color-text-inverse);
          font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 400; line-height: 20px;
          cursor: pointer;
        ">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 10V2M5 5l3-3 3 3M2 11.5V13a.5.5 0 0 0 .5.5h11A.5.5 0 0 0 14 13v-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Upload
        </button>
      </div>
    </div>
  </div>

</div>
