<div style="display: flex; flex-direction: row; gap: var(--space-250); align-items: center;">

  <!-- Left: gray placeholder with person icon (144×144) -->
  <div style="
    flex-shrink: 0; width: 144px; height: 144px;
    border-radius: var(--radius-large);
    background: #e7e7e7;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  ">
    <svg width="82" height="82" viewBox="0 0 82 82" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M41 41c10.77 0 19.5-8.73 19.5-19.5S51.77 2 41 2 21.5 10.73 21.5 21.5 30.23 41 41 41Z" fill="#b0b0b0"/>
      <path d="M5.93 75.31C8.27 62.4 23.25 52.5 41 52.5c17.75 0 32.73 9.9 35.07 22.81A3 3 0 0 1 73.13 79H8.87a3 3 0 0 1-2.94-3.69Z" fill="#b0b0b0"/>
    </svg>
  </div>

  <!-- Right: text + controls -->
  <div style="display: flex; flex-direction: column; gap: var(--space-200); align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: var(--space-075); align-items: flex-start; width: 356px;">
      <div style="display: flex; align-items: flex-start; gap: 6px; width: 100%;">
        <span style="font-family: 'Lexend', sans-serif; font-size: 20px; font-weight: 700; line-height: 24px; color: var(--color-text); white-space: nowrap;">
          Childs Photo
        </span>
        <span style="font-family: 'Lexend', sans-serif; font-size: 16px; font-weight: 400; line-height: 24px; color: var(--color-text-subtle);">
          (Optional)
        </span>
      </div>
      <p style="font-family: 'Lexend', sans-serif; font-size: 16px; font-weight: 400; line-height: 24px; color: var(--color-text-subtlest); width: 100%;">
        JPG or PNG. Max Size: 5MB
      </p>
    </div>
    <!-- Re-upload controls -->
    <div style="display: flex; align-items: center; gap: 13px;">
      <span style="font-family: 'Lexend', sans-serif; font-size: 16px; font-weight: 400; line-height: 24px; color: var(--color-text-subtlest); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 119px;">
        IMG123654qwerqweq
      </span>
      <button style="
        display: inline-flex; align-items: center; justify-content: center;
        height: 32px; min-width: 40px; padding: var(--space-100) var(--space-200);
        border-radius: var(--radius-medium); border: 1px solid var(--color-border-danger);
        background: transparent; color: var(--color-text-danger);
        font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 400; cursor: pointer;
      ">Delete</button>
      <button style="
        display: inline-flex; align-items: center; justify-content: center; gap: var(--space-100);
        height: 32px; min-width: 40px; padding: var(--space-100) var(--space-200);
        border-radius: var(--radius-medium); border: 1px solid transparent;
        background: var(--color-bg-brand-bold); color: var(--color-text-inverse);
        font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 400; cursor: pointer;
      ">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 10V2M5 5l3-3 3 3M2 11.5V13a.5.5 0 0 0 .5.5h11A.5.5 0 0 0 14 13v-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Upload
      </button>
    </div>
    <!-- Single upload button -->
    <button style="
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-100);
      height: 32px; min-width: 40px; padding: var(--space-100) var(--space-200);
      border-radius: var(--radius-medium); border: 1px solid var(--color-border-brand);
      background: var(--background); color: var(--color-text-brand);
      font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 400; cursor: pointer;
    ">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 10V2M5 5l3-3 3 3M2 11.5V13a.5.5 0 0 0 .5.5h11A.5.5 0 0 0 14 13v-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Upload
    </button>
  </div>

</div>
