<div style="display: flex; flex-direction: row; gap: var(--space-250); align-items: center;">

  <!-- Left: orange placeholder (144×144) -->
  <div style="
    flex-shrink: 0; width: 144px; height: 144px;
    border-radius: var(--radius-medium);
    background: var(--color-bg-accent-orange-subtlest);
    display: flex; align-items: center; justify-content: center;
  ">
    <span style="color: var(--color-text-brand); display: inline-flex;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 10V2M5 5l3-3 3 3M2 11.5V13a.5.5 0 0 0 .5.5h11A.5.5 0 0 0 14 13v-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>

  <!-- Right: text + button -->
  <div style="display: flex; flex-direction: column; gap: var(--space-200); align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: var(--space-075); align-items: flex-start; width: 356px;">
      <div style="display: flex; align-items: flex-start; gap: 6px; width: 100%;">
        <span style="font-family: 'Lexend', sans-serif; font-size: 20px; font-weight: 700; line-height: 24px; color: var(--color-text); white-space: nowrap;">
          Childs Photo
        </span>
        <span style="font-family: 'Lexend', sans-serif; font-size: 16px; font-weight: 400; line-height: 24px; color: var(--color-text-subtle);">
          (Optional)
        </span>
      </div>
      <p style="font-family: 'Lexend', sans-serif; font-size: 16px; font-weight: 400; line-height: 24px; color: var(--color-text-subtlest); width: 100%;">
        JPG or PNG. Max Size: 5MB
      </p>
    </div>
    <button style="
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-100);
      height: 32px; min-width: 40px; padding: var(--space-100) var(--space-200);
      border-radius: var(--radius-medium); border: 1px solid var(--color-border-brand);
      background: var(--background); color: var(--color-text-brand);
      font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 400; line-height: 20px;
      cursor: pointer;
    ">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 10V2M5 5l3-3 3 3M2 11.5V13a.5.5 0 0 0 .5.5h11A.5.5 0 0 0 14 13v-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Upload
    </button>
  </div>

</div>
