<style>
  .otp-root { display: inline-flex; align-items: center; gap: var(--space-150); }
  .otp-group { display: flex; align-items: center; }
  .otp-slot {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-top: 1px solid var(--border-input);
    border-bottom: 1px solid var(--border-input);
    border-right: 1px solid var(--border-input);
    background: var(--background);
    font-size: 14px;
    font-weight: 500;
    color: var(--foreground);
    transition: border-color 0.15s;
  }
  .otp-slot:first-child { border-left: 1px solid var(--border-input); border-radius: var(--radius-medium) 0 0 var(--radius-medium); }
  .otp-slot:last-child { border-radius: 0 var(--radius-medium) var(--radius-medium) 0; }
  .otp-slot input {
    position: absolute;
    inset: 0;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    text-transform: uppercase;
  }
  .otp-slot.active { outline: 2px solid var(--ring); outline-offset: -2px; z-index: 10; }
</style>

<div class="otp-root" role="group" aria-label="One-time password (alphanumeric)">
  <div class="otp-group">
    <div class="otp-slot"><input type="text" maxlength="1" pattern="[a-zA-Z0-9]" aria-label="Character 1" /></div>
    <div class="otp-slot"><input type="text" maxlength="1" pattern="[a-zA-Z0-9]" aria-label="Character 2" /></div>
    <div class="otp-slot"><input type="text" maxlength="1" pattern="[a-zA-Z0-9]" aria-label="Character 3" /></div>
    <div class="otp-slot"><input type="text" maxlength="1" pattern="[a-zA-Z0-9]" aria-label="Character 4" /></div>
    <div class="otp-slot"><input type="text" maxlength="1" pattern="[a-zA-Z0-9]" aria-label="Character 5" /></div>
    <div class="otp-slot"><input type="text" maxlength="1" pattern="[a-zA-Z0-9]" aria-label="Character 6" /></div>
  </div>
</div>

<script>
  const inputs = document.querySelectorAll('.otp-slot input');
  inputs.forEach((input, i) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/[^a-zA-Z0-9]/g, '').slice(-1);
      e.target.value = val;
      if (val && i < inputs.length - 1) inputs[i + 1].focus();
    });
    input.addEventListener('focus', () => e.target.closest('.otp-slot').classList.add('active'));
    input.addEventListener('blur', () => e.target.closest('.otp-slot').classList.remove('active'));
  });
</script>
