<!-- Static representation of a vertical resizable panel group -->
<style>
  .panel-group-v {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 576px;
    min-height: 300px;
    overflow: hidden;
    border-radius: var(--radius-large);
    border: 1px solid var(--border);
  }
  .panel-v {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: auto;
  }
  .panel-v:first-child { flex: 0 0 60%; }
  .panel-v:last-child  { flex: 0 0 40%; }
  .panel-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--secondary-foreground);
    font-family: var(--font-lexend, sans-serif);
  }
  .resize-handle-v {
    height: 1px;
    flex-shrink: 0;
    background: var(--border);
    cursor: row-resize;
    transition: background 150ms;
  }
  .resize-handle-v:hover {
    background: var(--border-hover);
  }
</style>

<div class="panel-group-v">
  <div class="panel-v">
    <span class="panel-label">Top Panel</span>
  </div>
  <div class="resize-handle-v"></div>
  <div class="panel-v">
    <span class="panel-label">Bottom Panel</span>
  </div>
</div>
