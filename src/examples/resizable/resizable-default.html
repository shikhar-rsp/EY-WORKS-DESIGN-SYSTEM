<!-- Static representation of a horizontal resizable panel group -->
<style>
  .panel-group {
    display: flex;
    flex-direction: row;
    width: 100%;
    max-width: 576px;
    min-height: 200px;
    overflow: hidden;
    border-radius: var(--radius-large);
    border: 1px solid var(--border);
  }
  .panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: auto;
    position: relative;
  }
  .panel-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--secondary-foreground);
    font-family: var(--font-lexend, sans-serif);
  }
  .resize-handle {
    width: 1px;
    flex-shrink: 0;
    background: var(--border);
    cursor: col-resize;
    transition: background 150ms;
  }
  .resize-handle:hover {
    background: var(--border-hover);
  }
</style>

<div class="panel-group">
  <div class="panel">
    <span class="panel-label">Panel One</span>
  </div>
  <div class="resize-handle"></div>
  <div class="panel">
    <span class="panel-label">Panel Two</span>
  </div>
</div>
