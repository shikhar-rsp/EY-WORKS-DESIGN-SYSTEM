<div style="display: flex; flex-direction: column; gap: 8px; width: 240px; padding: 16px;">

  <!-- Default -->
  <button
    style="
      display: flex;
      width: 100%;
      align-items: center;
      gap: var(--space-150);
      padding: var(--space-100);
      border-radius: var(--radius-medium);
      border: none;
      background: var(--background);
      color: var(--subtle);
      font-family: var(--font-lexend), sans-serif;
      font-size: 14px;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
    "
    onmouseover="this.style.background='var(--primary-subtle)'"
    onmouseout="this.style.background='var(--background)'"
  >
    Default
  </button>

  <!-- Hover -->
  <button
    style="
      display: flex;
      width: 100%;
      align-items: center;
      gap: var(--space-150);
      padding: var(--space-100);
      border-radius: var(--radius-medium);
      border: none;
      background: var(--primary-subtle);
      color: var(--subtle);
      font-family: var(--font-lexend), sans-serif;
      font-size: 14px;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
    "
  >
    Hover
  </button>

  <!-- Selected -->
  <button
    style="
      display: flex;
      width: 100%;
      align-items: center;
      gap: var(--space-150);
      padding: var(--space-100);
      border-radius: var(--radius-medium);
      border: none;
      background: var(--accent-gray-subtlest);
      color: var(--foreground);
      font-family: var(--font-lexend), sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
    "
  >
    Selected
  </button>

  <!-- Pressed -->
  <button
    style="
      display: flex;
      width: 100%;
      align-items: center;
      gap: var(--space-150);
      padding: var(--space-100);
      border-radius: var(--radius-medium);
      border: none;
      background: var(--primary-subtle-pressed);
      color: var(--subtle);
      font-family: var(--font-lexend), sans-serif;
      font-size: 14px;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
    "
  >
    Pressed
  </button>

  <!-- Disabled -->
  <button
    disabled
    style="
      display: flex;
      width: 100%;
      align-items: center;
      gap: var(--space-150);
      padding: var(--space-100);
      border-radius: var(--radius-medium);
      border: none;
      background: var(--background);
      color: var(--disabled);
      font-family: var(--font-lexend), sans-serif;
      font-size: 14px;
      line-height: 20px;
      text-align: left;
      pointer-events: none;
      cursor: default;
      opacity: 0.6;
    "
  >
    Disabled
  </button>

</div>
