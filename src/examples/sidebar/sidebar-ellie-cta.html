<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px;">

  <!-- Default -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <div
      style="
        position: relative;
        width: 218px;
        height: 156px;
        border-radius: 10px;
        overflow: hidden;
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(135deg, #f8785e 0%, #f472b6 50%, #a78bfa 100%);
      "
    >
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span
          style="
            color: var(--primary-foreground);
            font-size: 18px;
            letter-spacing: 0.43px;
            font-family: 'Abel', var(--font-lexend), sans-serif;
          "
        >Ellie</span>
        <p
          style="
            font-family: var(--font-lexend), sans-serif;
            font-size: 20px;
            font-weight: 700;
            line-height: 24px;
            color: var(--primary-foreground);
            margin: 0;
          "
        >How can I help you today?</p>
      </div>
      <button
        style="
          align-self: flex-start;
          padding: 4px var(--space-200);
          border-radius: var(--radius-medium);
          border: none;
          background: var(--background);
          color: var(--muted-foreground);
          font-family: var(--font-lexend), sans-serif;
          font-size: 14px;
          font-weight: 500;
          line-height: 20px;
          cursor: pointer;
        "
      >Button</button>
    </div>
    <span style="font-family: var(--font-lexend), sans-serif; font-size: 12px; color: var(--muted-foreground);">Default</span>
  </div>
