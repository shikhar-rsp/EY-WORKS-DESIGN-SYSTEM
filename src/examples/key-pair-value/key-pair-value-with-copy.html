<style>
  .kpv-row {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border, #ebe9e8);
  }
  .kpv-row:last-child { border-bottom: none; }
  .kpv-key {
    font-family: 'Lexend', sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 20px;
    color: var(--subtlest, #ada5a5);
    flex-shrink: 0;
    min-width: 100px;
  }
  .kpv-value-area {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .kpv-value-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kpv-value {
    flex: 1;
    min-width: 0;
    font-family: 'Lexend', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 20px;
    color: var(--foreground, #2e2b2b);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kpv-value-mono { font-family: 'Courier New', Courier, monospace; }
  .copy-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--subtlest, #ada5a5);
    border-radius: var(--radius-small, 4px);
    transition: color 150ms;
    padding: 0;
  }
  .copy-btn:hover { color: var(--foreground, #2e2b2b); }
</style>

<div style="padding:24px;width:100%;max-width:576px;">
  <div style="display:flex;flex-direction:column;">
    <div class="kpv-row">
      <span class="kpv-key">API Key</span>
      <div class="kpv-value-area">
        <div class="kpv-value-row">
          <span class="kpv-value kpv-value-mono">sk-1234567890abcdef</span>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('sk-1234567890abcdef')" title="Copy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 15H4C2.89543 15 2 14.1046 2 13V4C2 2.89543 2.89543 2 4 2H13C14.1046 2 15 2.89543 15 4V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="kpv-row">
      <span class="kpv-key">Webhook URL</span>
      <div class="kpv-value-area">
        <div class="kpv-value-row">
          <span class="kpv-value" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">https://api.example.com/hooks/abc123</span>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('https://api.example.com/hooks/abc123')" title="Copy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 15H4C2.89543 15 2 14.1046 2 13V4C2 2.89543 2.89543 2 4 2H13C14.1046 2 15 2.89543 15 4V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="kpv-row">
      <span class="kpv-key">Client ID</span>
      <div class="kpv-value-area">
        <div class="kpv-value-row">
          <span class="kpv-value kpv-value-mono">client_9f2e3d4c5b6a7890</span>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('client_9f2e3d4c5b6a7890')" title="Copy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 15H4C2.89543 15 2 14.1046 2 13V4C2 2.89543 2.89543 2 4 2H13C14.1046 2 15 2.89543 15 4V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
