<style>
  .ds-table-wrap { overflow: hidden; border-radius: var(--radius-large, 16px); border: 1px solid var(--border, #ebe9e8); width: 100%; }
  .ds-table { width: 100%; border-collapse: collapse; }
  .ds-th {
    background: var(--secondary, #f4f4f4);
    border-bottom: 1px solid var(--border, #ebe9e8);
    height: 40px;
    padding: 0 var(--space-200, 16px);
    text-align: left;
    cursor: pointer;
    transition: background-color 150ms;
  }
  .ds-th:hover { background: var(--accent-gray-subtle, #c7c6c6); }
  .ds-th-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'Lexend', sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted-foreground, #7a7272);
    white-space: nowrap;
    user-select: none;
  }
  .ds-th-right { text-align: right; }
  .ds-th-right .ds-th-label { justify-content: flex-end; }
  .ds-td {
    background: var(--background, #ffffff);
    border-bottom: 1px solid var(--border, #ebe9e8);
    height: 72px;
    padding: var(--space-100, 8px) var(--space-200, 16px);
    transition: background-color 150ms;
  }
  .ds-tr:hover .ds-td { background: var(--secondary, #f4f4f4); }
  .ds-td-last { border-bottom: none; }
  .ds-td-right { text-align: right; }
  .sort-icon { width: 7px; height: 7px; color: var(--muted-foreground, #7a7272); }
</style>
