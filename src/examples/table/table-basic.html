<style>
  .ds-table-wrap { overflow: hidden; border-radius: var(--radius-large, 16px); border: 1px solid var(--border, #ebe9e8); width: 100%; }
  .ds-table { width: 100%; border-collapse: collapse; }
  .ds-th {
    background: var(--secondary, #f4f4f4);
    border-bottom: 1px solid var(--border, #ebe9e8);
    height: 40px;
    padding: 0 var(--space-200, 16px);
    text-align: left;
    transition: background-color 150ms;
  }
  .ds-th:hover { background: var(--accent-gray-subtle, #c7c6c6); }
  .ds-th-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'Lexend', sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted-foreground, #7a7272);
    white-space: nowrap;
  }
  .ds-th-right { text-align: right; }
  .ds-th-right .ds-th-label { justify-content: flex-end; }
  .ds-td {
    background: var(--background, #ffffff);
    border-bottom: 1px solid var(--border, #ebe9e8);
    height: 72px;
    padding: var(--space-100, 8px) var(--space-200, 16px);
    transition: background-color 150ms;
  }
  .ds-tr:hover .ds-td { background: var(--secondary, #f4f4f4); }
  .ds-td-last { border-bottom: none; }
  .ds-td-right { text-align: right; }
  .ds-text-main { font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 500; color: var(--foreground, #2e2b2b); }
  .ds-text-sub { font-family: 'Lexend', sans-serif; font-size: 14px; color: var(--muted-foreground, #7a7272); }
  .ds-badge {
    font-family: 'Lexend', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: var(--radius-full, 99px);
    display: inline-block;
  }
  .ds-badge-active { background: rgba(101,163,13,0.1); color: var(--success, #65a30d); }
  .ds-badge-inactive { background: var(--muted, #fafafa); color: var(--muted-foreground, #7a7272); }
  .sort-icon { width: 7px; height: 7px; color: var(--muted-foreground, #7a7272); }
</style>

<div style="padding:24px;width:100%;max-width:768px;">
  <div class="ds-table-wrap">
    <table class="ds-table">
      <thead>
        <tr>
          <th class="ds-th">
            <span class="ds-th-label">
              Name
              <svg class="sort-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4V20M12 4L8 8M12 4L16 8M12 20L8 16M12 20L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </th>
          <th class="ds-th"><span class="ds-th-label">Role</span></th>
          <th class="ds-th"><span class="ds-th-label">Department</span></th>
          <th class="ds-th ds-th-right"><span class="ds-th-label">Status</span></th>
        </tr>
      </thead>
      <tbody>
        <tr class="ds-tr">
          <td class="ds-td"><span class="ds-text-main">Alice Johnson</span></td>
          <td class="ds-td"><span class="ds-text-sub">Designer</span></td>
          <td class="ds-td"><span class="ds-text-sub">Product</span></td>
          <td class="ds-td ds-td-right"><span class="ds-badge ds-badge-active">Active</span></td>
        </tr>
        <tr class="ds-tr">
          <td class="ds-td"><span class="ds-text-main">Bob Smith</span></td>
          <td class="ds-td"><span class="ds-text-sub">Engineer</span></td>
          <td class="ds-td"><span class="ds-text-sub">Platform</span></td>
          <td class="ds-td ds-td-right"><span class="ds-badge ds-badge-active">Active</span></td>
        </tr>
        <tr class="ds-tr">
          <td class="ds-td"><span class="ds-text-main">Carol White</span></td>
          <td class="ds-td"><span class="ds-text-sub">PM</span></td>
          <td class="ds-td"><span class="ds-text-sub">Growth</span></td>
          <td class="ds-td ds-td-right"><span class="ds-badge ds-badge-inactive">Inactive</span></td>
        </tr>
        <tr class="ds-tr">
          <td class="ds-td ds-td-last"><span class="ds-text-main">David Lee</span></td>
          <td class="ds-td ds-td-last"><span class="ds-text-sub">Analyst</span></td>
          <td class="ds-td ds-td-last"><span class="ds-text-sub">Data</span></td>
          <td class="ds-td ds-td-last ds-td-right"><span class="ds-badge ds-badge-active">Active</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
