<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: 'Lexend', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: var(--background, #ffffff); }
    .command { display: flex; flex-direction: column; overflow: hidden; border-radius: var(--radius-large, 16px); border: 1px solid var(--border, #ebe9e8); background: var(--background, #ffffff); width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .input-wrap { display: flex; align-items: center; border-bottom: 1px solid var(--border, #ebe9e8); padding: 0 12px; }
    .input-wrap svg { color: var(--muted-foreground, #7a7272); flex-shrink: 0; margin-right: 6px; }
    .input-wrap input { flex: 1; height: 40px; background: transparent; border: none; outline: none; font-size: 14px; color: var(--foreground, #2e2b2b); font-family: inherit; }
    .input-wrap input::placeholder { color: var(--placeholder, #b5b0af); }
    .list { max-height: 300px; overflow-y: auto; padding: 4px; }
    .group { overflow: hidden; padding: 4px; }
    .group-heading { padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted-foreground, #7a7272); }
    .item { display: flex; align-items: center; width: 100%; padding: 6px 12px; font-size: 14px; color: var(--foreground, #2e2b2b); border-radius: 4px; border: none; background: transparent; cursor: pointer; text-align: left; gap: 12px; box-sizing: border-box; font-family: inherit; }
    .item:hover, .item:focus { background: var(--muted, #fafafa); outline: none; }
    .item[hidden] { display: none; }
    .shortcut { margin-left: auto; font-size: 12px; color: var(--muted-foreground, #7a7272); letter-spacing: 0.1em; }
    .separator { margin: 4px -4px; border-top: 1px solid var(--border, #ebe9e8); }
    .empty { padding: 24px; text-align: center; font-size: 14px; color: var(--muted-foreground, #7a7272); display: none; }
    .empty.visible { display: block; }
  </style>
</head>
<body>
  <div class="command" role="combobox" aria-expanded="true" aria-haspopup="listbox">
    <div class="input-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Type a command or search…" role="searchbox" aria-label="Search" oninput="filterItems(this.value)" />
    </div>
    <div class="list" role="listbox" id="list">
      <div class="group" role="group">
        <div class="group-heading">Suggestions</div>
        <button class="item" role="option" data-value="calendar" data-keywords="schedule date">Calendar</button>
        <button class="item" role="option" data-value="search" data-keywords="find lookup">Search</button>
      </div>
      <hr class="separator" />
      <div class="group" role="group">
        <div class="group-heading">Settings</div>
        <button class="item" role="option" data-value="profile" data-keywords="account user">Profile <span class="shortcut">⌘P</span></button>
        <button class="item" role="option" data-value="billing" data-keywords="payment subscription">Billing <span class="shortcut">⌘B</span></button>
        <button class="item" role="option" data-value="settings" data-keywords="preferences config">Settings <span class="shortcut">⌘S</span></button>
      </div>
      <div class="empty" id="empty">No results found.</div>
    </div>
  </div>
  <script>
    function filterItems(q) {
      var items = document.querySelectorAll('.item');
      var visible = 0;
      items.forEach(function(item) {
        var text = (item.dataset.value + ' ' + (item.dataset.keywords || '')).toLowerCase();
        var show = !q || text.includes(q.toLowerCase());
        item.hidden = !show;
        if (show) visible++;
      });
      document.getElementById('empty').className = visible === 0 ? 'empty visible' : 'empty';
    }
  </script>
</body>
</html>
