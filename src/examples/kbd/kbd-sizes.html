<div style="display: inline-flex; align-items: center; gap: 16px;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <kbd style="
      display: inline-flex; align-items: center; justify-content: center;
      height: 20px; min-width: 20px; padding: 0 var(--space-075);
      border-radius: var(--radius-small); border: 1px solid var(--border);
      background: var(--muted); font-size: 11px; font-weight: 500;
      color: var(--muted-foreground); user-select: none;
    ">Esc</kbd>
    <span style="font-size: 12px; color: var(--muted-foreground);">sm</span>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <kbd style="
      display: inline-flex; align-items: center; justify-content: center;
      height: 24px; min-width: 24px; padding: 0 var(--space-100);
      border-radius: var(--radius-small); border: 1px solid var(--border);
      background: var(--muted); font-size: 12px; font-weight: 500;
      color: var(--muted-foreground); user-select: none;
    ">Esc</kbd>
    <span style="font-size: 12px; color: var(--muted-foreground);">md</span>
  </div>
</div>
