<style>
  .tg-multi-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 36px; min-width: 36px; padding: 0 var(--space-150);
    font-family: var(--font-lexend), sans-serif; font-weight: 500; font-size: 14px;
    background: transparent; color: var(--muted-foreground);
    border: none; border-radius: var(--radius-medium); cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tg-multi-btn:hover, .tg-multi-btn[aria-checked="true"] {
    background: var(--muted); color: var(--foreground);
  }
</style>
<div role="group" style="display: flex; align-items: center; gap: var(--space-050);">
  <button type="button" role="checkbox" aria-checked="true" class="tg-multi-btn"
    onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')==='true' ? 'false' : 'true');">
    <strong>B</strong>
  </button>
  <button type="button" role="checkbox" aria-checked="false" class="tg-multi-btn"
    onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')==='true' ? 'false' : 'true');">
    <em>I</em>
  </button>
  <button type="button" role="checkbox" aria-checked="false" class="tg-multi-btn"
    onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')==='true' ? 'false' : 'true');">
    <u>U</u>
  </button>
</div>
