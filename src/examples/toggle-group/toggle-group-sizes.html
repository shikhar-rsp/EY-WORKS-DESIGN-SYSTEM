<style>
  .tg-size-btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-lexend), sans-serif; font-weight: 500;
    background: transparent; color: var(--muted-foreground);
    border: none; border-radius: var(--radius-medium); cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tg-size-btn:hover, .tg-size-btn[aria-checked="true"] {
    background: var(--muted); color: var(--foreground);
  }
  .tg-sm { height: 28px; min-width: 28px; padding: 0 6px; font-size: 12px; }
  .tg-md { height: 36px; min-width: 36px; padding: 0 12px; font-size: 14px; }
  .tg-lg { height: 40px; min-width: 40px; padding: 0 16px; font-size: 14px; }
</style>
<div style="display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <span style="width: 24px; font-family: var(--font-lexend); font-size: 12px; color: var(--muted-foreground);">sm</span>
    <div role="radiogroup" style="display: flex; gap: 4px;">
      <button class="tg-size-btn tg-sm" role="radio" aria-checked="true">A</button>
      <button class="tg-size-btn tg-sm" role="radio" aria-checked="false">B</button>
      <button class="tg-size-btn tg-sm" role="radio" aria-checked="false">C</button>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 16px;">
    <span style="width: 24px; font-family: var(--font-lexend); font-size: 12px; color: var(--muted-foreground);">md</span>
    <div role="radiogroup" style="display: flex; gap: 4px;">
      <button class="tg-size-btn tg-md" role="radio" aria-checked="true">A</button>
      <button class="tg-size-btn tg-md" role="radio" aria-checked="false">B</button>
      <button class="tg-size-btn tg-md" role="radio" aria-checked="false">C</button>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 16px;">
    <span style="width: 24px; font-family: var(--font-lexend); font-size: 12px; color: var(--muted-foreground);">lg</span>
    <div role="radiogroup" style="display: flex; gap: 4px;">
      <button class="tg-size-btn tg-lg" role="radio" aria-checked="true">A</button>
      <button class="tg-size-btn tg-lg" role="radio" aria-checked="false">B</button>
      <button class="tg-size-btn tg-lg" role="radio" aria-checked="false">C</button>
    </div>
  </div>
</div>
