<style>
  .tg-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 36px; min-width: 36px; padding: 0 var(--space-150);
    font-family: var(--font-lexend), sans-serif; font-weight: 500; font-size: 14px;
    background: transparent; color: var(--muted-foreground);
    border: none; border-radius: var(--radius-medium); cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tg-btn:hover, .tg-btn[aria-checked="true"] {
    background: var(--muted); color: var(--foreground);
  }
</style>
<div role="radiogroup" style="display: flex; align-items: center; gap: var(--space-050);">
  <button type="button" role="radio" aria-checked="false" class="tg-btn"
    onclick="this.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked','false')); this.setAttribute('aria-checked','true');">
    Left
  </button>
  <button type="button" role="radio" aria-checked="true" class="tg-btn"
    onclick="this.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked','false')); this.setAttribute('aria-checked','true');">
    Center
  </button>
  <button type="button" role="radio" aria-checked="false" class="tg-btn"
    onclick="this.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked','false')); this.setAttribute('aria-checked','true');">
    Right
  </button>
</div>
