<style>
  .slider-root {
    position: relative;
    display: flex;
    align-items: center;
    width: 256px;
    height: 20px;
  }
  .slider-track {
    position: relative;
    overflow: hidden;
    border-radius: 9999px;
    background: var(--muted-active);
    height: 6px;
    width: 100%;

  .slider-range {
    position: absolute;
    height: 100%;
    border-radius: 9999px;
    background: var(--primary);

    width: 50%;
  }

<div class="slider-root">
  <div class="slider-track">
    <div class="slider-range"></div>
  </div>
  <p style="margin-top: 8px; font-size: 12px; color: var(--muted-foreground);">Range: 20 – 70 (interactive range sliders require JS)</p>
</div>
