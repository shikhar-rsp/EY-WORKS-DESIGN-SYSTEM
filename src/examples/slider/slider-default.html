<style>
  .slider-root {
    position: relative;
    display: flex;
    align-items: center;
    width: 256px;
    height: 20px;
    touch-action: none;
    user-select: none;
  }
  .slider-track {
    position: relative;
    overflow: hidden;
    border-radius: 9999px;
    background: var(--muted-active);
    height: 6px;
    width: 100%;
  }
  .slider-range {
    position: absolute;
    left: 0;
    height: 100%;
    border-radius: 9999px;
    background: var(--primary);
    width: 33%;
  }
  .slider-input {
    position: absolute;
    width: 100%;
    height: 6px;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  .slider-input::-webkit-slider-thumb {
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--primary-foreground);
    border: 2px solid var(--primary);
    cursor: pointer;
  }
</style>

<div class="slider-root">
  <div class="slider-track">
    <div class="slider-range" id="range"></div>
  </div>
  <input
    class="slider-input"
    type="range"
    min="0"
    max="100"
    value="33"
    oninput="document.getElementById('range').style.width = this.value + '%'"
  />
</div>
