<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Sizes</title>
</head>
<body>
  <div style="display: flex; align-items: flex-end; gap: 16px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position:relative;display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;overflow:hidden;border-radius:9999px;background:var(--primary-subtle);font-family:var(--font-lexend),sans-serif;font-size:8px;font-weight:500;color:var(--foreground);flex-shrink:0;">MH</span>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">xs</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position:relative;display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;overflow:hidden;border-radius:9999px;background:var(--primary-subtle);font-family:var(--font-lexend),sans-serif;font-size:10px;font-weight:500;color:var(--foreground);flex-shrink:0;">MH</span>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">sm</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position:relative;display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;overflow:hidden;border-radius:9999px;background:var(--primary-subtle);font-family:var(--font-lexend),sans-serif;font-size:12px;font-weight:500;color:var(--foreground);flex-shrink:0;">MH</span>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">default</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position:relative;display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;overflow:hidden;border-radius:9999px;background:var(--primary-subtle);font-family:var(--font-lexend),sans-serif;font-size:14px;font-weight:500;color:var(--foreground);flex-shrink:0;">MH</span>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">lg</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position:relative;display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;overflow:hidden;border-radius:9999px;background:var(--primary-subtle);font-family:var(--font-lexend),sans-serif;font-size:14px;font-weight:500;color:var(--foreground);flex-shrink:0;">MH</span>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">xl</span>
    </div>
  </div>
</body>
</html>
