<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Status</title>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 16px;">
    <!-- Online -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position:relative;display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;overflow:hidden;border-radius:9999px;background:var(--primary-subtle);font-family:var(--font-lexend),sans-serif;font-size:14px;font-weight:500;color:var(--foreground);">
        MH
        <span style="position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:9999px;background:var(--success);border:2px solid var(--background);transform:translate(2px,2px);"></span>
      </span>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">online</span>
    </div>
    <!-- Offline -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position:relative;display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;overflow:hidden;border-radius:9999px;background:var(--primary-subtle);font-family:var(--font-lexend),sans-serif;font-size:14px;font-weight:500;color:var(--foreground);">
        MH
        <span style="position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:9999px;background:var(--muted-foreground);border:2px solid var(--background);transform:translate(2px,2px);"></span>
      </span>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">offline</span>
    </div>
    <!-- Busy -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position:relative;display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;overflow:hidden;border-radius:9999px;background:var(--primary-subtle);font-family:var(--font-lexend),sans-serif;font-size:14px;font-weight:500;color:var(--foreground);">
        MH
        <span style="position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:9999px;background:var(--destructive);border:2px solid var(--background);transform:translate(2px,2px);"></span>
      </span>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">busy</span>
    </div>
    <!-- Away -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <span style="position:relative;display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;overflow:hidden;border-radius:9999px;background:var(--primary-subtle);font-family:var(--font-lexend),sans-serif;font-size:14px;font-weight:500;color:var(--foreground);">
        MH
        <span style="position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:9999px;background:var(--warning);border:2px solid var(--background);transform:translate(2px,2px);"></span>
      </span>
      <span style="font-family:var(--font-lexend),sans-serif;font-size:12px;color:var(--muted-foreground);">away</span>
    </div>
  </div>
</body>
</html>
