<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Group</title>
  <style>
    .avatar {
      position: relative;
      display: inline-flex;
      width: 32px; height: 32px;
      align-items: center; justify-content: center;
      overflow: hidden; border-radius: 9999px;
      background: var(--primary-subtle);
      font-family: var(--font-lexend), sans-serif;
      font-size: 12px; font-weight: 500;
      color: var(--foreground);
      flex-shrink: 0;
    }
    .avatar-wrap {
      position: relative;
      border-radius: 9999px;
      border: 2px solid var(--background);
    }
    .avatar-wrap + .avatar-wrap { margin-left: -8px; }
    .avatar-group { display: inline-flex; align-items: center; }
  </style>
</head>
<body>
  <div class="avatar-group" role="group" aria-label="Avatar group, 6 members">
    <div class="avatar-wrap"><span class="avatar">AC</span></div>
    <div class="avatar-wrap"><span class="avatar">MH</span></div>
    <div class="avatar-wrap"><span class="avatar">JD</span></div>
    <div class="avatar-wrap"><span class="avatar">SR</span></div>
    <div class="avatar-wrap">
      <span class="avatar" aria-label="+2 more">+2</span>
    </div>
  </div>
</body>
</html>
