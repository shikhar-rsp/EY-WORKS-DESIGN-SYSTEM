<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Badge – Count</title>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--background, #ffffff); font-family: var(--font-lexend, sans-serif); }
  </style>
</head>
<body>
  <!-- Badge root: relative wrapper -->
  <div style="position: relative; display: inline-flex;">
    <!-- BadgeIndicator: count variant, danger color, top-right placement -->
    <span
      aria-label="5 notifications"
      style="
        position: absolute;
        z-index: 10;
        top: -4px;
        right: -4px;
        transform: translate(33%, -33%);
        min-width: 18px;
        height: 18px;
        border-radius: 9999px;
        padding: 0 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--destructive, #cc0000);
        color: var(--destructive-foreground, #ffffff);
        font-family: var(--font-lexend, sans-serif);
        font-size: 10px;
        font-weight: 600;
        line-height: 1;
        box-shadow: 0 0 0 2px var(--background, #ffffff);
      "
    >5</span>
    <!-- Avatar fallback -->
    <span style="
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      background: var(--muted, #fafafa);
      color: var(--foreground, #2e2b2b);
      font-family: var(--font-lexend, sans-serif);
      font-size: 12px;
      font-weight: 500;
    ">JD</span>
  </div>
</body>
</html>
