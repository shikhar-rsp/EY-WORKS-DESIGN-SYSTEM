<!-- Select with grouped options -->
<style>
  .select-wrapper {
    position: relative;
    width: 224px;
    font-family: var(--font-lexend, sans-serif);
    font-size: 14px;
  }
  .select-trigger {
    display: flex;
    height: 36px;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    border-radius: var(--radius-medium);
    border: 1px solid var(--border-input);
    background: var(--background);
    padding: 0 var(--space-150);
    color: var(--foreground);
    cursor: pointer;
  }
  .select-trigger:focus { outline: 2px solid var(--ring); outline-offset: 2px; }
  .select-placeholder { color: var(--placeholder); }
  .select-chevron { width: 16px; height: 16px; opacity: 0.5; flex-shrink: 0; }
  .select-content {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 50;
    width: 100%;
    overflow: hidden;
    border-radius: var(--radius-medium);
    border: 1px solid var(--border);
    background: var(--background);
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    padding: 4px;
    display: none;
  }
  .select-wrapper:focus-within .select-content { display: block; }
  .select-label {
    padding: 6px 8px 2px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted-foreground);
  }
  .select-item {
    display: flex;
    align-items: center;
    padding: 6px 8px;
    border-radius: var(--radius-small);
    cursor: pointer;
    color: var(--foreground);
  }
  .select-item:hover { background: var(--muted-hover); }
  .select-separator { height: 1px; background: var(--border); margin: 4px 0; }
</style>

<div class="select-wrapper" tabindex="0">
  <div class="select-trigger">
    <span class="select-placeholder">Select a fruit</span>
    <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </div>
  <div class="select-content">
    <div class="select-label">Fruits</div>
    <div class="select-item">Apple</div>
    <div class="select-item">Banana</div>
    <div class="select-item">Blueberry</div>
    <div class="select-item">Grapes</div>
    <div class="select-separator"></div>
    <div class="select-label">Vegetables</div>
    <div class="select-item">Carrot</div>
    <div class="select-item">Potato</div>
  </div>
</div>
