<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Form — Basic</title>
  <style>
    body { margin: 0; font-family: var(--font-lexend, 'Lexend', sans-serif); background: var(--background, #ffffff); color: var(--foreground, #2e2b2b); }
    :root {
      --background: #ffffff; --foreground: #2e2b2b;
      --muted-foreground: #7a7272;
      --border: #ebe9e8; --border-input: #ada5a5;
      --placeholder: #c7c6c6; --ring: #8290dd;
      --primary: #f8785e; --primary-foreground: #ffffff; --primary-hover: #cf624c;
      --destructive: #cc0000;
      --radius-medium: 8px; --space-075: 6px; --space-200: 16px;
    }
    .form { display: flex; flex-direction: column; gap: var(--space-200); width: 320px; }
    .form-field { display: flex; flex-direction: column; }
    .form-item { display: flex; flex-direction: column; gap: var(--space-075); }
    .form-label { display: inline-flex; align-items: center; gap: 4px; font-size: 0.875rem; font-weight: 500; line-height: 1; color: var(--foreground); user-select: none; }
    .form-input { height: 36px; width: 100%; border-radius: var(--radius-medium); border: 1px solid var(--border-input); background: var(--background); padding: 0 var(--space-200); font-size: 0.875rem; font-family: inherit; color: var(--foreground); outline: none; box-sizing: border-box; }
    .form-input::placeholder { color: var(--placeholder); }
    .form-input:focus { border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 30%, transparent); }
    .form-description { font-size: 0.75rem; line-height: 1.625; color: var(--muted-foreground); margin: 0; }
    .form-submit { display: inline-flex; height: 36px; align-items: center; justify-content: center; border-radius: var(--radius-medium); background: var(--primary); border: none; padding: 0 var(--space-200); font-size: 0.875rem; font-family: inherit; font-weight: 500; color: var(--primary-foreground); cursor: pointer; transition: background 150ms; }
    .form-submit:hover { background: var(--primary-hover); }
  </style>
</head>
<body>
  <form class="form" onsubmit="handleSubmit(event)">
    <div class="form-field">
      <div class="form-item">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="you@example.com" />
        <p class="form-description">We'll never share your email.</p>
      </div>
    </div>
    <button class="form-submit" type="submit">Submit</button>
  </form>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      console.log('Submitted:', { email });
    }
  </script>
</body>
</html>
