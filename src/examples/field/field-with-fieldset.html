<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Field — With Fieldset</title>
  <style>
    body { margin: 0; font-family: var(--font-lexend, 'Lexend', sans-serif); background: var(--background, #ffffff); }
    :root {
      --background: #ffffff; --foreground: #2e2b2b;
      --muted-foreground: #7a7272; --border: #ebe9e8; --border-input: #ada5a5;
      --placeholder: #c7c6c6; --ring: #8290dd;
      --radius-medium: 8px; --space-050: 4px; --space-075: 6px; --space-200: 16px;
    }
    fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--space-200); width: 288px; }
    legend { font-size: 1rem; font-weight: 600; color: var(--foreground); line-height: 1; padding: 0; margin-bottom: var(--space-050); }
    .field-description-top { font-size: 0.75rem; line-height: 1.625; color: var(--muted-foreground); margin: 0; }
    .field-group { display: flex; flex-direction: column; gap: var(--space-200); }
    .field { display: flex; flex-direction: column; gap: var(--space-075); }
    .field-label { font-size: 0.875rem; font-weight: 500; line-height: 1; color: var(--foreground); }
    .field-input { height: 36px; width: 100%; border-radius: var(--radius-medium); border: 1px solid var(--border-input); background: var(--background); padding: 0 var(--space-200); font-size: 0.875rem; color: var(--foreground); outline: none; box-sizing: border-box; }
    .field-input::placeholder { color: var(--placeholder); }
    .field-input:focus { border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 30%, transparent); }
  </style>
</head>
<body>
  <fieldset>
    <legend>Account details</legend>
    <p class="field-description-top">Used to sign in and receive notifications.</p>
    <div class="field-group">
      <div class="field">
        <label class="field-label" for="fs-name">Full name</label>
        <input class="field-input" id="fs-name" type="text" placeholder="Jane Doe" />
      </div>
      <div class="field">
        <label class="field-label" for="fs-email">Email</label>
        <input class="field-input" id="fs-email" type="email" placeholder="jane@example.com" />
      </div>
    </div>
  </fieldset>
</body>
</html>
