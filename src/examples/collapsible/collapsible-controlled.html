<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px;">
  <button
    onclick="toggleFromOutside()"
    style="
      border-radius: var(--radius-small);
      border: 1px solid var(--border);
      padding: 4px 12px;
      font-family: var(--font-lexend, sans-serif);
      font-size: 12px;
      background: transparent;
      color: var(--foreground);
      cursor: pointer;
    "
    onmouseover="this.style.background='var(--muted-hover)'"
    onmouseout="this.style.background='transparent'"
  >
    Toggle externally
  </button>

  <div style="width: 256px;">
    <button
      id="ctrl-trigger"
      aria-expanded="false"
      onclick="toggleCtrl()"
      style="
        display: flex; width: 100%; align-items: center; justify-content: space-between;
        border-radius: var(--radius-medium); padding: 12px 16px;
        background: transparent; border: none; color: var(--foreground);
        font-family: var(--font-lexend, sans-serif); font-size: 14px; cursor: pointer;
      "
      onmouseover="this.style.background='var(--muted-hover)'"
      onmouseout="this.style.background='transparent'"
    >
      <span>Repositories</span>
      <svg id="ctrl-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 200ms;">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>

    <div id="ctrl-content" style="display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms ease-out;">
      <div style="overflow: hidden;">
        <ul style="margin-top: 8px; display: flex; flex-direction: column; gap: 4px; padding-left: 16px;">
          <li style="border-radius: var(--radius-medium); padding: 8px 16px; font-size: 14px; color: var(--muted-foreground);">@design-system/ui</li>
          <li style="border-radius: var(--radius-medium); padding: 8px 16px; font-size: 14px; color: var(--muted-foreground);">@design-system/icons</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
  let ctrlOpen = false;
  const ctrlTrigger = document.getElementById('ctrl-trigger');
  const ctrlContent = document.getElementById('ctrl-content');
  const ctrlChevron = document.getElementById('ctrl-chevron');

  function applyCtrl() {
    ctrlTrigger.setAttribute('aria-expanded', ctrlOpen);
    ctrlContent.style.gridTemplateRows = ctrlOpen ? '1fr' : '0fr';
    ctrlChevron.style.transform = ctrlOpen ? 'rotate(180deg)' : '';
  }

  function toggleCtrl() { ctrlOpen = !ctrlOpen; applyCtrl(); }
  function toggleFromOutside() { ctrlOpen = !ctrlOpen; applyCtrl(); }
</script>
