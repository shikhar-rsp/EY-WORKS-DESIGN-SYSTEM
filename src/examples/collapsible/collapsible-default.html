<div style="width: 256px;">
  <button
    id="collapsible-trigger"
    aria-expanded="false"
    onclick="toggleCollapsible()"
    style="
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      border-radius: var(--radius-medium);
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--foreground);
      font-family: var(--font-lexend, sans-serif);
      font-size: 14px;
      cursor: pointer;
    "
    onmouseover="this.style.background='var(--muted-hover)'"
    onmouseout="this.style.background='transparent'"
  >
    <span>Repositories</span>
    <svg
      id="collapsible-chevron"
      xmlns="http://www.w3.org/2000/svg"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      style="transition: transform 200ms ease-out;"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  <div
    id="collapsible-content"
    data-state="closed"
    style="
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 200ms ease-out;
    "
  >
    <div style="overflow: hidden;">
      <ul style="margin-top: 8px; display: flex; flex-direction: column; gap: 4px; padding-left: 16px;">
        <li style="border-radius: var(--radius-medium); padding: 8px 16px; font-size: 14px; font-family: var(--font-lexend, sans-serif); color: var(--muted-foreground); cursor: pointer;" onmouseover="this.style.background='var(--muted-hover)'" onmouseout="this.style.background='transparent'">@design-system/ui</li>
        <li style="border-radius: var(--radius-medium); padding: 8px 16px; font-size: 14px; font-family: var(--font-lexend, sans-serif); color: var(--muted-foreground); cursor: pointer;" onmouseover="this.style.background='var(--muted-hover)'" onmouseout="this.style.background='transparent'">@design-system/icons</li>
        <li style="border-radius: var(--radius-medium); padding: 8px 16px; font-size: 14px; font-family: var(--font-lexend, sans-serif); color: var(--muted-foreground); cursor: pointer;" onmouseover="this.style.background='var(--muted-hover)'" onmouseout="this.style.background='transparent'">@design-system/tokens</li>
      </ul>
    </div>
  </div>
</div>

<script>
  let collapsibleOpen = false;
  const trigger = document.getElementById('collapsible-trigger');
  const content = document.getElementById('collapsible-content');
  const chevron = document.getElementById('collapsible-chevron');

  function toggleCollapsible() {
    collapsibleOpen = !collapsibleOpen;
    trigger.setAttribute('aria-expanded', collapsibleOpen);
    content.setAttribute('data-state', collapsibleOpen ? 'open' : 'closed');
    content.style.gridTemplateRows = collapsibleOpen ? '1fr' : '0fr';
    chevron.style.transform = collapsibleOpen ? 'rotate(180deg)' : 'rotate(0deg)';
  }
</script>
