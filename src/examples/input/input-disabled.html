<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Input — Disabled</title>
  <style>
    body { margin: 0; font-family: var(--font-lexend, 'Lexend', sans-serif); background: var(--background, #ffffff); }
    :root {
      --background: #ffffff; --foreground: #2e2b2b;
      --disabled: #2724244f; --disabled-surface: #ffffff; --disabled-border: #27242424;
      --radius-medium: 8px; --space-075: 6px; --space-150: 12px;
    }
    .field { display: flex; flex-direction: column; gap: var(--space-075); width: 256px; padding: 24px; }
    .label { font-size: 0.875rem; font-weight: 500; color: var(--foreground); }
    .input { display: flex; height: 36px; width: 100%; border-radius: var(--radius-medium); border: 1px solid var(--disabled-border); background: var(--disabled-surface); padding: 0 var(--space-150); font-size: 0.875rem; color: var(--disabled); cursor: not-allowed; outline: none; box-sizing: border-box; }
    .input::placeholder { color: var(--disabled); }
  </style>
</head>
<body>
  <div class="field">
    <label class="label" for="username">Username</label>
    <input class="input" id="username" type="text" placeholder="Cannot edit" disabled />
  </div>
</body>
</html>
