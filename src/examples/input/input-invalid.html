<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Input — Invalid</title>
  <style>
    body { margin: 0; font-family: var(--font-lexend, 'Lexend', sans-serif); background: var(--background, #ffffff); }
    :root {
      --background: #ffffff; --foreground: #2e2b2b;
      --destructive: #cc0000;
      --radius-medium: 8px; --space-075: 6px; --space-150: 12px;
    }
    .field { display: flex; flex-direction: column; gap: var(--space-075); width: 256px; padding: 24px; }
    .label { font-size: 0.875rem; font-weight: 500; color: var(--destructive); }
    .input { display: flex; height: 36px; width: 100%; border-radius: var(--radius-medium); border: 1px solid var(--destructive); background: var(--background); padding: 0 var(--space-150); font-size: 0.875rem; color: var(--foreground); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--destructive) 30%, transparent); box-sizing: border-box; }
    .error { font-size: 0.75rem; color: var(--destructive); }
  </style>
</head>
<body>
  <div class="field">
    <label class="label" for="password">Password</label>
    <input class="input" id="password" type="password" value="abc" aria-invalid="true" />
    <p class="error" role="alert" aria-live="polite">Must be at least 8 characters.</p>
  </div>
</body>
</html>
