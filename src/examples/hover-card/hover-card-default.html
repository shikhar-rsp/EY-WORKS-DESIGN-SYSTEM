<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hover Card — Default</title>
  <style>
    body { margin: 0; font-family: var(--font-lexend, 'Lexend', sans-serif); background: var(--background, #ffffff); color: var(--foreground, #2e2b2b); }
    :root {
      --background: #ffffff; --foreground: #2e2b2b;
      --primary: #f8785e;
      --muted: #fafafa; --muted-foreground: #7a7272;
      --secondary-foreground: #505258;
      --border: #ebe9e8;
      --radius-medium: 8px; --radius-large: 16px; --radius-full: 99px;
      --space-100: 8px; --space-150: 12px; --space-200: 16px;
    }

    .trigger { position: relative; display: inline-block; }
    .trigger-link { font-size: 0.875rem; font-weight: 500; color: var(--primary); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
    .trigger-link:hover + .card { opacity: 1; visibility: visible; transform: scale(1); }

    .card {
      position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%) scale(0.95);
      width: 256px; border-radius: var(--radius-large); border: 1px solid var(--border);
      background: var(--background); padding: var(--space-200); box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      opacity: 0; visibility: hidden;
      transition: opacity 0.15s ease-out, transform 0.15s ease-out;
      z-index: 50;
    }
    .trigger:hover .card { opacity: 1; visibility: visible; transform: translateX(-50%) scale(1); }

    .card-header { display: flex; align-items: center; gap: var(--space-150); margin-bottom: var(--space-100); }
    .avatar { width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--muted); }
    .name { font-size: 0.875rem; font-weight: 600; color: var(--foreground); margin: 0; }
    .handle { font-size: 0.75rem; color: var(--muted-foreground); margin: 0; }
    .bio { font-size: 0.875rem; color: var(--secondary-foreground); margin: 0 0 var(--space-100); }
    .joined { font-size: 0.75rem; color: var(--muted-foreground); margin: 0; }
  </style>
</head>
<body style="padding: 40px; display: flex; justify-content: center;">
  <div class="trigger">
    <span class="trigger-link">@nextjs</span>
    <div class="card" role="tooltip">
      <div class="card-header">
        <div class="avatar"></div>
        <div>
          <p class="name">Next.js</p>
          <p class="handle">@nextjs</p>
        </div>
      </div>
      <p class="bio">The React framework for the web. Used by some of the world's largest companies.</p>
      <p class="joined">Joined December 2021</p>
    </div>
  </div>
</body>
</html>
