<div style="width: 100%; max-width: 448px; padding: 24px;">
  <div style="width: 100%;">

    <!-- Item 1 -->
    <div
      id="accordion-item-1"
      data-state="open"
      style="border-bottom: 1px solid var(--border);"
    >
      <h3 style="display: flex; margin: 0;">
        <button
          type="button"
          aria-expanded="true"
          aria-controls="accordion-content-1"
          data-state="open"
          onclick="toggleAccordion('1')"
          style="
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-200);
            padding: var(--space-200) 0;
            font-family: var(--font-lexend), sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--foreground);
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            text-decoration: none;
            transition: text-decoration 0.15s;
          "
          onmouseover="this.style.textDecoration='underline'"
          onmouseout="this.style.textDecoration='none'"
        >
          Is it accessible?
          <svg
            id="accordion-chevron-1"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="color: var(--foreground); flex-shrink: 0; transition: transform 0.2s; transform: rotate(180deg);"
          >
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </h3>
      <div
        id="accordion-content-1"
        role="region"
        aria-labelledby="accordion-trigger-1"
        data-state="open"
        style="overflow: hidden;"
      >
        <div style="padding-bottom: var(--space-200); font-family: var(--font-lexend), sans-serif; font-size: 14px; color: var(--secondary-foreground);">
          Yes. It adheres to the WAI-ARIA design pattern.
        </div>
      </div>
    </div>

    <!-- Item 2 -->
    <div
      id="accordion-item-2"
      data-state="closed"
      style="border-bottom: 1px solid var(--border);"
    >
      <h3 style="display: flex; margin: 0;">
        <button
          type="button"
          aria-expanded="false"
          aria-controls="accordion-content-2"
          data-state="closed"
          onclick="toggleAccordion('2')"
          style="
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-200);
            padding: var(--space-200) 0;
            font-family: var(--font-lexend), sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--foreground);
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
          "
          onmouseover="this.style.textDecoration='underline'"
          onmouseout="this.style.textDecoration='none'"
        >
          Is it styled?
          <svg
            id="accordion-chevron-2"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="color: var(--foreground); flex-shrink: 0; transition: transform 0.2s;"
          >
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </h3>
      <div
        id="accordion-content-2"
        role="region"
        data-state="closed"
        style="overflow: hidden; max-height: 0; transition: max-height 0.2s ease-out;"
      >
        <div style="padding-bottom: var(--space-200); font-family: var(--font-lexend), sans-serif; font-size: 14px; color: var(--secondary-foreground);">
          Yes. It comes with default styles that match the other components' aesthetic.
        </div>
      </div>
    </div>

    <!-- Item 3 -->
    <div
      id="accordion-item-3"
      data-state="closed"
    >
      <h3 style="display: flex; margin: 0;">
        <button
          type="button"
          aria-expanded="false"
          aria-controls="accordion-content-3"
          data-state="closed"
          onclick="toggleAccordion('3')"
          style="
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-200);
            padding: var(--space-200) 0;
            font-family: var(--font-lexend), sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--foreground);
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
          "
          onmouseover="this.style.textDecoration='underline'"
          onmouseout="this.style.textDecoration='none'"
        >
          Is it animated?
          <svg
            id="accordion-chevron-3"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="color: var(--foreground); flex-shrink: 0; transition: transform 0.2s;"
          >
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </h3>
      <div
        id="accordion-content-3"
        role="region"
        data-state="closed"
        style="overflow: hidden; max-height: 0; transition: max-height 0.2s ease-out;"
      >
        <div style="padding-bottom: var(--space-200); font-family: var(--font-lexend), sans-serif; font-size: 14px; color: var(--secondary-foreground);">
          Yes. It's animated by default, but you can disable it if you prefer.
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // Single-type accordion: only one item open at a time
  var openItem = '1';

  function toggleAccordion(id) {
    var prev = openItem;
    if (prev === id) {
      // Collapse current
      collapse(id);
      openItem = null;
    } else {
      // Collapse previous, open new
      if (prev) collapse(prev);
      expand(id);
      openItem = id;
    }
  }

  function expand(id) {
    var content = document.getElementById('accordion-content-' + id);
    var chevron = document.getElementById('accordion-chevron-' + id);
    var item = document.getElementById('accordion-item-' + id);
    var btn = item.querySelector('button');
    content.style.maxHeight = content.scrollHeight + 'px';
    content.dataset.state = 'open';
    chevron.style.transform = 'rotate(180deg)';
    btn.setAttribute('aria-expanded', 'true');
    btn.dataset.state = 'open';
    item.dataset.state = 'open';
  }

  function collapse(id) {
    var content = document.getElementById('accordion-content-' + id);
    var chevron = document.getElementById('accordion-chevron-' + id);
    var item = document.getElementById('accordion-item-' + id);
    var btn = item.querySelector('button');
    content.style.maxHeight = '0';
    content.dataset.state = 'closed';
    chevron.style.transform = 'rotate(0deg)';
    btn.setAttribute('aria-expanded', 'false');
    btn.dataset.state = 'closed';
    item.dataset.state = 'closed';
  }
</script>
